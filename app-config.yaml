# App configuration: which modules are included in the composed template.yaml.
# Used by scripts/compose-template.sh. Edit to enable/disable modules.
# project_name and environment can be overridden by samconfig.toml at deploy time.

project_name: myapp
environment: dev

core_modules:
  - tenant-management
  - user-management
  - audit-log
  - notification-management
  - storage-management
  - form-management
  - workflow-management

# Product-specific modules (add when you run generate-module.sh --type app)
app_modules:
  - events-management
  - alumni-management
  - dept-branding-management
  - dept-activities-management
  - dept-academics-management
  - dept-research-management
  - dept-people-management
  - dept-info-management
  - department-management
  - faculty-management
  - accreditations-management
  - admissions-management

