# ─── Queries ──────────────────────────────────────────────────────────────────

extend type Query {
  getAdmissionsOverview(tenantId: ID):                   AdmissionsOverview  @aws_api_key @aws_cognito_user_pools
  listAdmissionsPrograms(level: String, tenantId: ID):   [AdmissionsProgram] @aws_api_key @aws_cognito_user_pools
  listUGCourses(tenantId: ID):                           [UGCourse]          @aws_api_key @aws_cognito_user_pools
  listPGCourses(tenantId: ID):                           [PGCourse]          @aws_api_key @aws_cognito_user_pools
  listEligibilityEntries(tenantId: ID):                  [EligibilityEntry]  @aws_api_key @aws_cognito_user_pools
  listAdmissionSteps(tenantId: ID):                      [AdmissionStep]     @aws_api_key @aws_cognito_user_pools
  listImportantDates(tenantId: ID):                      [ImportantDate]     @aws_api_key @aws_cognito_user_pools
  getProspectus(tenantId: ID):                           Prospectus          @aws_api_key @aws_cognito_user_pools
  listFeeDocuments(tenantId: ID):                        [FeeDocument]       @aws_api_key @aws_cognito_user_pools
  listScholarships(tenantId: ID):                        [Scholarship]       @aws_api_key @aws_cognito_user_pools
  listAuditStatements(tenantId: ID):                     [AuditStatement]    @aws_api_key @aws_cognito_user_pools
  listAdmissionsEnquiries(status: String, tenantId: ID): [AdmissionsEnquiry] @aws_cognito_user_pools
  listAdmissionsContacts(tenantId: ID):                  [AdmissionsContact] @aws_api_key @aws_cognito_user_pools
  getWhyEnquire(tenantId: ID):                           WhyEnquire          @aws_api_key @aws_cognito_user_pools
  listEnquiryCategories(tenantId: ID):                   [EnquiryCategory]   @aws_api_key @aws_cognito_user_pools
  listInfoBlocks(tenantId: ID):                          [InfoBlock]         @aws_api_key @aws_cognito_user_pools
}

# ─── Mutations ────────────────────────────────────────────────────────────────

extend type Mutation {
  # Singletons
  saveAdmissionsOverview(input: SaveAdmissionsOverviewInput!): AdmissionsOverview!
  saveProspectus(input: SaveProspectusInput!):                 Prospectus!
  deleteProspectus:                                            Boolean!
  saveWhyEnquire(input: SaveWhyEnquireInput!):                 WhyEnquire!

  # Programs
  createAdmissionsProgram(input: CreateAdmissionsProgramInput!): AdmissionsProgram!
  updateAdmissionsProgram(input: UpdateAdmissionsProgramInput!): AdmissionsProgram!
  deleteAdmissionsProgram(programId: ID!):                        AdmissionsProgram!

  # UG Courses
  createUGCourse(input: CreateUGCourseInput!): UGCourse!
  updateUGCourse(input: UpdateUGCourseInput!): UGCourse!
  deleteUGCourse(courseId: ID!):               UGCourse!

  # PG Courses
  createPGCourse(input: CreatePGCourseInput!): PGCourse!
  updatePGCourse(input: UpdatePGCourseInput!): PGCourse!
  deletePGCourse(courseId: ID!):               PGCourse!

  # Eligibility entries
  createEligibilityEntry(input: CreateEligibilityEntryInput!): EligibilityEntry!
  updateEligibilityEntry(input: UpdateEligibilityEntryInput!): EligibilityEntry!
  deleteEligibilityEntry(entryId: ID!):                         EligibilityEntry!

  # Steps
  createAdmissionStep(input: CreateAdmissionStepInput!): AdmissionStep!
  updateAdmissionStep(input: UpdateAdmissionStepInput!): AdmissionStep!
  deleteAdmissionStep(stepId: ID!):                       AdmissionStep!
  reorderAdmissionSteps(ids: [ID!]!):                     [AdmissionStep]!

  # Important Dates
  createImportantDate(input: CreateImportantDateInput!): ImportantDate!
  updateImportantDate(input: UpdateImportantDateInput!): ImportantDate!
  deleteImportantDate(dateId: ID!):                       ImportantDate!

  # Fee Documents
  createFeeDocument(input: CreateFeeDocumentInput!): FeeDocument!
  updateFeeDocument(input: UpdateFeeDocumentInput!): FeeDocument!
  deleteFeeDocument(feeDocId: ID!):                   Boolean!

  # Scholarships
  createScholarship(input: CreateScholarshipInput!): Scholarship!
  updateScholarship(input: UpdateScholarshipInput!): Scholarship!
  deleteScholarship(scholarshipId: ID!):              Scholarship!

  # Audit Statements
  createAuditStatement(input: CreateAuditStatementInput!): AuditStatement!
  deleteAuditStatement(auditId: ID!):                       Boolean!

  # Enquiry Categories
  createEnquiryCategory(input: CreateEnquiryCategoryInput!): EnquiryCategory!
  updateEnquiryCategory(input: UpdateEnquiryCategoryInput!): EnquiryCategory!
  deleteEnquiryCategory(categoryId: ID!):                     EnquiryCategory!

  # Info Blocks
  createInfoBlock(input: CreateInfoBlockInput!): InfoBlock!
  updateInfoBlock(input: UpdateInfoBlockInput!): InfoBlock!
  deleteInfoBlock(blockId: ID!):                  InfoBlock!

  # Enquiries & Contacts
  updateEnquiryStatus(enquiryId: ID!, status: EnquiryStatus!):                    AdmissionsEnquiry!
  updateAdmissionsContact(contactId: ID!, input: UpdateAdmissionsContactInput!): AdmissionsContact!

  # Public (unauthenticated)
  submitAdmissionsEnquiry(input: EnquirySubmitInput!): Boolean! @aws_api_key
}
