# ─── Queries ──────────────────────────────────────────────────────────────────
extend type Query {
  # Alumni
  getAlumni(alumniId: ID!): Alumni @aws_api_key @aws_cognito_user_pools
  listAlumni(department: String, batch: String, search: String, limit: Int, nextToken: String): AlumniList @aws_api_key @aws_cognito_user_pools

  # AlumniEvent
  getAlumniEvent(eventId: ID!): AlumniEvent @aws_api_key @aws_cognito_user_pools
  listAlumniEvents(department: String, status: String, limit: Int, nextToken: String): AlumniEventList @aws_api_key @aws_cognito_user_pools

  # Timeline
  listAlumniTimelineEntries(limit: Int, nextToken: String): AlumniTimelineEntryList @aws_api_key @aws_cognito_user_pools

  # Vision/Mission
  getAlumniVisionMission: AlumniVisionMission @aws_api_key @aws_cognito_user_pools

  # Committee
  listAlumniCommitteeMembers(roleType: String, limit: Int, nextToken: String): AlumniCommitteeMemberList @aws_api_key @aws_cognito_user_pools

  # Dean Message
  getAlumniDeanMessage: AlumniDeanMessage @aws_api_key @aws_cognito_user_pools

  # Coordinators
  listAlumniCoordinators(roleType: String, department: String, limit: Int, nextToken: String): AlumniCoordinatorList @aws_api_key @aws_cognito_user_pools


  # Registration Settings
  getAlumniRegistrationSettings: AlumniRegistrationSettings @aws_api_key @aws_cognito_user_pools

  # Contacts
  listAlumniContacts(department: String, limit: Int, nextToken: String): AlumniContactList @aws_api_key @aws_cognito_user_pools
}

# ─── Mutations ────────────────────────────────────────────────────────────────
extend type Mutation {
  # Alumni
  createAlumni(input: CreateAlumniInput!): Alumni
  updateAlumni(input: UpdateAlumniInput!): Alumni
  deleteAlumni(alumniId: ID!): Alumni

  # AlumniEvent
  createAlumniEvent(input: CreateAlumniEventInput!): AlumniEvent
  updateAlumniEvent(input: UpdateAlumniEventInput!): AlumniEvent
  deleteAlumniEvent(eventId: ID!): AlumniEvent

  # Timeline
  createAlumniTimelineEntry(input: CreateAlumniTimelineEntryInput!): AlumniTimelineEntry
  updateAlumniTimelineEntry(input: UpdateAlumniTimelineEntryInput!): AlumniTimelineEntry
  deleteAlumniTimelineEntry(entryId: ID!): AlumniTimelineEntry

  # Vision/Mission (singleton upsert)
  upsertAlumniVisionMission(input: UpsertAlumniVisionMissionInput!): AlumniVisionMission

  # Committee Members
  createAlumniCommitteeMember(input: CreateAlumniCommitteeMemberInput!): AlumniCommitteeMember
  updateAlumniCommitteeMember(input: UpdateAlumniCommitteeMemberInput!): AlumniCommitteeMember
  deleteAlumniCommitteeMember(memberId: ID!): AlumniCommitteeMember

  # Dean Message (singleton upsert)
  upsertAlumniDeanMessage(input: UpsertAlumniDeanMessageInput!): AlumniDeanMessage

  # Coordinators
  createAlumniCoordinator(input: CreateAlumniCoordinatorInput!): AlumniCoordinator
  updateAlumniCoordinator(input: UpdateAlumniCoordinatorInput!): AlumniCoordinator
  deleteAlumniCoordinator(coordinatorId: ID!): AlumniCoordinator


  # Registration Settings (singleton upsert)
  upsertAlumniRegistrationSettings(input: UpsertAlumniRegistrationSettingsInput!): AlumniRegistrationSettings

  # Contacts
  createAlumniContact(input: CreateAlumniContactInput!): AlumniContact
  updateAlumniContact(input: UpdateAlumniContactInput!): AlumniContact
  deleteAlumniContact(contactId: ID!): AlumniContact
}
