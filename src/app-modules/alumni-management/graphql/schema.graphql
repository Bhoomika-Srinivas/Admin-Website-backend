# ─── Alumni ───────────────────────────────────────────────────────────────────
type Alumni @aws_api_key @aws_cognito_user_pools {
  alumniId:    ID!
  name:        String!
  batch:       String!
  department:  String
  company:     String
  designation: String
  location:    String
  email:       String
  linkedin:    String
  image:       String
  createdAt:   AWSDateTime
  updatedAt:   AWSDateTime
}

type AlumniList @aws_api_key @aws_cognito_user_pools {
  items:     [Alumni]
  nextToken: String
}

input CreateAlumniInput {
  name:        String!
  batch:       String!
  department:  String
  company:     String
  designation: String
  location:    String
  email:       String
  linkedin:    String
  image:       String
}

input UpdateAlumniInput {
  alumniId:    ID!
