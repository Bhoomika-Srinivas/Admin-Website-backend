type Department @aws_cognito_user_pools @aws_api_key {
  departmentId:  ID!
  tenantId:      ID!
  name:          String!
  shortName:     String!
  hod:           String
  established:   Int
  totalFaculty:  Int
  totalStudents: Int
  status:        String
  description:   String
  imageUrl:      String
  programTypes:  [String]
  createdAt:     AWSDateTime
  updatedAt:     AWSDateTime
}

type DepartmentList @aws_cognito_user_pools @aws_api_key {
  items:     [Department]
  nextToken: String
}

input CreateDepartmentInput {
  name:         String!
  shortName:    String!
  hod:          String
  established:  Int
  description:  String
  imageUrl:     String
  status:       String
  programTypes: [String]
}

input UpdateDepartmentInput {
  departmentId:  ID!
  name:          String
  shortName:     String
  hod:           String
  established:   Int
  totalFaculty:  Int
  totalStudents: Int
  description:   String
  imageUrl:      String
  status:        String
  programTypes:  [String]
}

extend type Query {
  # Public endpoints now require tenantId for tenant isolation
  getDepartment(departmentId: ID!, tenantId: ID!): Department @aws_cognito_user_pools @aws_api_key
  listDepartments(tenantId: ID!, limit: Int, nextToken: String): DepartmentList @aws_cognito_user_pools @aws_api_key
}

extend type Mutation {
  createDepartment(input: CreateDepartmentInput!): Department
  updateDepartment(input: UpdateDepartmentInput!): Department
  deleteDepartment(departmentId: ID!): Department
}
