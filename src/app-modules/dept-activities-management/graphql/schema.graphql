type PlacementOverview @aws_api_key @aws_cognito_user_pools {
  placementOverviewId: ID!
  deptId:              ID!
  academicYear:        String
  companiesVisited:    Int
  studentsInCampus:    Int
  studentsOffCampus:   Int
  highestPackage:      String
  createdAt:           AWSDateTime
}

type StudentPlacement @aws_api_key @aws_cognito_user_pools {
  studentPlacementId: ID!
  deptId:             ID!
  studentName:        String!
  usn:                String
  batch:              String
  company:            String
  role:               String
  package:            Float
  imageUrl:           String
  createdAt:          AWSDateTime
}

type Achievement @aws_api_key @aws_cognito_user_pools {
  achievementId: ID!
  deptId:        ID!
  type:          String
  text:          String!
  createdAt:     AWSDateTime
}

type DeptActivity @aws_api_key @aws_cognito_user_pools {
  deptActivityId: ID!
  deptId:         ID!
  type:           String
  name:           String!
  description:    String
  date:           String
  venue:          String
  organizer:      String
  participants:   Int
  createdAt:      AWSDateTime
}

type ForumSection @aws_api_key @aws_cognito_user_pools {
  forumSectionId: ID
  deptId:         ID!
  title:          String!
  description:    String
  createdAt:      AWSDateTime
}

type ForumEvent @aws_api_key @aws_cognito_user_pools {
  forumEventId:  ID!
  deptId:        ID!
  title:         String!
  description:   String
  attachmentUrl: String
  createdAt:     AWSDateTime
}

type DepartmentActivityLog @aws_api_key @aws_cognito_user_pools {
  deptActivityLogId: ID!
  deptId:            ID!
  text:              String!
  createdBy:         String
  createdAt:         AWSDateTime
}

type Newsletter @aws_api_key @aws_cognito_user_pools {
  newsletterId: ID!
  deptId:       ID!
  year:         String!
  fileUrl:      String
  createdAt:    AWSDateTime
}

type GalleryPhoto @aws_api_key @aws_cognito_user_pools {
  galleryPhotoId: ID!
  deptId:         ID!
  title:          String
  category:       String
  imageUrl:       String!
  capturedAt:     String
  createdAt:      AWSDateTime
}

type PlacementOverviewList     @aws_api_key @aws_cognito_user_pools { items: [PlacementOverview]     nextToken: String }
type StudentPlacementList      @aws_api_key @aws_cognito_user_pools { items: [StudentPlacement]      nextToken: String }
type AchievementList           @aws_api_key @aws_cognito_user_pools { items: [Achievement]           nextToken: String }
type DeptActivityList          @aws_api_key @aws_cognito_user_pools { items: [DeptActivity]          nextToken: String }
type ForumEventList            @aws_api_key @aws_cognito_user_pools { items: [ForumEvent]            nextToken: String }
type DepartmentActivityLogList @aws_api_key @aws_cognito_user_pools { items: [DepartmentActivityLog] nextToken: String }
type NewsletterList            @aws_api_key @aws_cognito_user_pools { items: [Newsletter]            nextToken: String }
type GalleryPhotoList          @aws_api_key @aws_cognito_user_pools { items: [GalleryPhoto]          nextToken: String }

input CreatePlacementOverviewInput {
  deptId:            ID!
  academicYear:      String
  companiesVisited:  Int
  studentsInCampus:  Int
  studentsOffCampus: Int
  highestPackage:    String
}
input UpdatePlacementOverviewInput {
  placementOverviewId: ID!
  academicYear:        String
  companiesVisited:    Int
  studentsInCampus:    Int
  studentsOffCampus:   Int
  highestPackage:      String
}

input CreateStudentPlacementInput {
  deptId:      ID!
  studentName: String!
  usn:         String
  batch:       String
  company:     String
  role:        String
  package:     Float
  imageUrl:    String
}
input UpdateStudentPlacementInput {
  studentPlacementId: ID!
  studentName:        String
  usn:                String
  batch:              String
  company:            String
  role:               String
  package:            Float
  imageUrl:           String
}

input CreateAchievementInput { deptId: ID!  type: String  text: String! }
input UpdateAchievementInput { achievementId: ID!  type: String  text: String }

input CreateDeptActivityInput {
  deptId:       ID!
  type:         String
  name:         String!
  description:  String
  date:         String
  venue:        String
  organizer:    String
  participants: Int
}
input UpdateDeptActivityInput {
  deptActivityId: ID!
  type:           String
  name:           String
  description:    String
  date:           String
  venue:          String
  organizer:      String
  participants:   Int
}

input SaveForumSectionInput { deptId: ID!  title: String!  description: String }

input CreateForumEventInput { deptId: ID!  title: String!  description: String  attachmentUrl: String }
input UpdateForumEventInput { forumEventId: ID!  title: String  description: String  attachmentUrl: String }

input CreateDepartmentActivityInput { deptId: ID!  text: String! }
input UpdateDepartmentActivityInput { deptActivityLogId: ID!  text: String }

input CreateNewsletterInput {
  deptId:  ID!
  year:    String!
  fileUrl: String
}
input UpdateNewsletterInput {
  newsletterId: ID!
  year:         String
  fileUrl:      String
}

input CreateGalleryPhotoInput {
  deptId:     ID!
  title:      String
  category:   String
  imageUrl:   String!
  capturedAt: String
}
input UpdateGalleryPhotoInput {
  galleryPhotoId: ID!
  title:          String
  category:       String
  imageUrl:       String
  capturedAt:     String
}

extend type Query {
  listPlacementOverviews(deptId: ID!, tenantId: ID, academicYear: String): PlacementOverviewList @aws_api_key @aws_cognito_user_pools
  listStudentPlacements(deptId: ID!, tenantId: ID, batch: String, limit: Int, nextToken: String): StudentPlacementList @aws_api_key @aws_cognito_user_pools
  listAchievements(deptId: ID!, tenantId: ID, type: String): AchievementList @aws_api_key @aws_cognito_user_pools
  listDeptActivities(deptId: ID!, tenantId: ID, type: String, limit: Int, nextToken: String): DeptActivityList @aws_api_key @aws_cognito_user_pools
  getForumSection(deptId: ID!, tenantId: ID): ForumSection @aws_api_key @aws_cognito_user_pools
  listForumEvents(deptId: ID!, tenantId: ID, limit: Int, nextToken: String): ForumEventList @aws_api_key @aws_cognito_user_pools
  listDepartmentActivities(deptId: ID!, tenantId: ID, limit: Int, nextToken: String): DepartmentActivityLogList @aws_api_key @aws_cognito_user_pools
  listNewsletters(deptId: ID!, tenantId: ID): NewsletterList @aws_api_key @aws_cognito_user_pools
  listGalleryPhotos(deptId: ID!, tenantId: ID, category: String, limit: Int, nextToken: String): GalleryPhotoList @aws_api_key @aws_cognito_user_pools
}

extend type Mutation {
  createPlacementOverview(input: CreatePlacementOverviewInput!): PlacementOverview
  updatePlacementOverview(input: UpdatePlacementOverviewInput!): PlacementOverview
  deletePlacementOverview(placementOverviewId: ID!): PlacementOverview

  createStudentPlacement(input: CreateStudentPlacementInput!): StudentPlacement
  updateStudentPlacement(input: UpdateStudentPlacementInput!): StudentPlacement
  deleteStudentPlacement(studentPlacementId: ID!): StudentPlacement

  createAchievement(input: CreateAchievementInput!): Achievement
  updateAchievement(input: UpdateAchievementInput!): Achievement
  deleteAchievement(achievementId: ID!): Achievement

  createDeptActivity(input: CreateDeptActivityInput!): DeptActivity
  updateDeptActivity(input: UpdateDeptActivityInput!): DeptActivity
  deleteDeptActivity(deptActivityId: ID!): DeptActivity

  saveForumSection(input: SaveForumSectionInput!): ForumSection

  createForumEvent(input: CreateForumEventInput!): ForumEvent
  updateForumEvent(input: UpdateForumEventInput!): ForumEvent
  deleteForumEvent(forumEventId: ID!): ForumEvent

  createDepartmentActivity(input: CreateDepartmentActivityInput!): DepartmentActivityLog
  updateDepartmentActivity(input: UpdateDepartmentActivityInput!): DepartmentActivityLog
  deleteDepartmentActivity(deptActivityLogId: ID!): DepartmentActivityLog

  createNewsletter(input: CreateNewsletterInput!): Newsletter
  updateNewsletter(input: UpdateNewsletterInput!): Newsletter
  deleteNewsletter(newsletterId: ID!): Newsletter

  createGalleryPhoto(input: CreateGalleryPhotoInput!): GalleryPhoto
  updateGalleryPhoto(input: UpdateGalleryPhotoInput!): GalleryPhoto
  deleteGalleryPhoto(galleryPhotoId: ID!): GalleryPhoto
}
