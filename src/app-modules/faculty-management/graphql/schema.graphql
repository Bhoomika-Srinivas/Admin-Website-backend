type Faculty @aws_api_key @aws_cognito_user_pools {
  facultyId: ID!
  firstName: String!
  lastName: String!
  email: String!
  title: String
  department: String
  designation: String
  bio: String
  profileImage: String
  phone: String
  officeLocation: String
  website: String
  publications: [Publication]
  education: [Education]
  workExperience: [WorkExperience]
  researchProjects: [ResearchProject]
  courseTeachings: [CourseTeaching]
  honors: [Honor]
  createdAt: AWSDateTime
  updatedAt: AWSDateTime
}

