  educationId: ID!
  facultyId: ID!
  degree: String!
  institution: String!
  fieldOfStudy: String
  startYear: Int
  endYear: Int
  description: String
  createdAt: AWSDateTime
  updatedAt: AWSDateTime
}

type WorkExperience {
  workExperienceId: ID!
