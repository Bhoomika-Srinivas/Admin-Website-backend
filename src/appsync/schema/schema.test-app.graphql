scalar AWSDateTime
scalar AWSJSON

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type MutationResponse {
  success: Boolean!
  message: String
}

input PaginationInput {
  limit: Int
  cursor: String
}

type Query {
  _empty: String
  getTenant(tenant_id: ID!): Tenant
  listTenants(pagination: PaginationInput): TenantConnection
  getUser(user_id: ID!): User
  listUsers(pagination: PaginationInput): UserConnection
  listRoles(pagination: PaginationInput): [Role!]
  getAuditEntry(entry_id: ID!): AuditEntry
  listAuditEntries(filter: AuditEntryFilter, pagination: PaginationInput): AuditEntryConnection
}
type Mutation {
  _empty: String
  createTenant(input: CreateTenantInput!): Tenant
  updateTenant(tenant_id: ID!, input: UpdateTenantInput!): Tenant
  suspendTenant(tenant_id: ID!): Tenant
  updateUser(user_id: ID!, input: UpdateUserInput!): User
  inviteUser(input: InviteUserInput!): User
  deactivateUser(user_id: ID!): User
  createRole(input: CreateRoleInput!): Role
  updateRole(role_id: ID!, input: UpdateRoleInput!): Role
  assignRole(user_id: ID!, role_id: ID!): User
  removeRole(user_id: ID!, role_id: ID!): User
}

# module: tenant-management
enum TenantPlan {
  free
  starter
  pro
  enterprise
}

enum TenantStatus {
  active
  suspended
  archived
}

type TenantConfig {
  features_enabled: [String]
  max_users: Int
  branding: TenantBranding
}

type TenantBranding {
  logo_url: String
  primary_color: String
}

type Tenant {
  tenant_id: ID!
  name: String!
  slug: String!
  plan: TenantPlan!
  status: TenantStatus!
  config: TenantConfig
  owner_user_id: String
  created_by: String
  created_at: AWSDateTime
  updated_at: AWSDateTime
}

type TenantConnection {
  items: [Tenant!]!
  nextCursor: String
}

input CreateTenantInput {
  name: String!
  slug: String
  plan: TenantPlan
  owner_user_id: String
  config: TenantConfigInput
}

input TenantConfigInput {
  features_enabled: [String]
  max_users: Int
  branding: TenantBrandingInput
}

input TenantBrandingInput {
  logo_url: String
  primary_color: String
}

input UpdateTenantInput {
  name: String
  slug: String
  plan: TenantPlan
  config: TenantConfigInput
}



# module: user-management
enum UserStatus {
  active
  invited
  suspended
  deactivated
}

type User {
  user_id: ID!
  tenant_id: ID!
  email: String!
  name: String
  status: UserStatus!
  roles: [String!]
  profile: AWSJSON
  created_at: AWSDateTime
  updated_at: AWSDateTime
}

type UserConnection {
  items: [User!]!
  nextCursor: String
}

type Role {
  role_id: ID!
  tenant_id: ID!
  name: String!
  description: String
  permissions: [String!]
  is_system: Boolean
  created_at: AWSDateTime
  updated_at: AWSDateTime
}

type RoleConnection {
  items: [Role!]!
  nextCursor: String
}

input UpdateUserInput {
  name: String
  profile: AWSJSON
  status: UserStatus
}

input InviteUserInput {
  email: String!
  name: String
}

input CreateRoleInput {
  name: String!
  description: String
  permissions: [String!]
}

input UpdateRoleInput {
  name: String
  description: String
  permissions: [String!]
}



# module: audit-log
type AuditEntry {
  entry_id: ID!
  tenant_id: ID!
  actor_id: String
  actor_email: String
  action: String!
  resource_type: String
  resource_id: String
  before: AWSJSON
  after: AWSJSON
  metadata: AuditMetadata
  timestamp: AWSDateTime
}

type AuditMetadata {
  ip: String
  user_agent: String
  source: String
  detail_type: String
}

type AuditEntryConnection {
  items: [AuditEntry!]!
  nextCursor: String
}

input AuditEntryFilter {
  action: String
  resource_type: String
  actor_id: String
  from: AWSDateTime
  to: AWSDateTime
}


