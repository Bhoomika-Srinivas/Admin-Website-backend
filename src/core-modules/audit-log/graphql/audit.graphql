type AuditEntry {
  entry_id: ID!
  tenant_id: ID!
  actor_id: String
  actor_email: String
  action: String!
  resource_type: String
  resource_id: String
  before: AWSJSON
  after: AWSJSON
  metadata: AWSJSON
  timestamp: AWSDateTime
  severity: String
  # Frontend-facing camelCase aliases
  id: ID
  userId: String
  userName: String
  resourceType: String
  resourceId: String
  ipAddress: String
  createdAt: AWSDateTime
}

type AuditEntryConnection {
  items: [AuditEntry!]!
  nextCursor: String
  pageInfo: PageInfo
}

input AuditFilterInput {
  action: String
  resource_type: String
  actor_id: String
  from: AWSDateTime
  to: AWSDateTime
}

extend type Query {
  getAuditEntry(entry_id: ID!): AuditEntry
  listAuditEntries(filter: AuditFilterInput, pagination: PaginationInput): AuditEntryConnection
}
