enum UserStatus {
  active
  invited
  suspended
  deactivated
}

type User {
  user_id: ID!
  tenant_id: ID!
  email: String!
  name: String
  phone: String
  status: UserStatus!
  roles: [String!]
  role: String
  department: String
  last_login_at: AWSDateTime
  profile: AWSJSON
  created_at: AWSDateTime
  updated_at: AWSDateTime
}

type UserConnection {
  items: [User!]!
  nextCursor: String
  pageInfo: PageInfo
}

type Role {
  role_id: ID!
  tenant_id: ID!
  name: String!
  description: String
  permissions: [String!]
  is_system: Boolean
  created_at: AWSDateTime
  updated_at: AWSDateTime
}

input UpdateUserInput {
  name: String
  phone: String
  profile: AWSJSON
  status: UserStatus
  role: String
  department: String
}

input InviteUserInput {
  email: String!
  name: String
  phone: String
  role: String!
  department: String
  password: String!
}

input CreateRoleInput {
  name: String!
  description: String
  permissions: [String!]
}

input UpdateRoleInput {
  name: String
  description: String
  permissions: [String!]
}

extend type Query {
  getMe: User
  getUser(user_id: ID!): User
  listUsers(pagination: PaginationInput): UserConnection
  listRoles(pagination: PaginationInput): [Role]
}

extend type Mutation {
  updateUser(user_id: String!, input: UpdateUserInput!): MutationResponse
  inviteUser(input: InviteUserInput!): MutationResponse
  deactivateUser(user_id: String!): MutationResponse
  createRole(input: CreateRoleInput!): Role
  updateRole(role_id: String!, input: UpdateRoleInput!): Role
  assignRole(user_id: String!, role_id: String!): MutationResponse
  removeRole(user_id: String!, role_id: String!): MutationResponse
}
