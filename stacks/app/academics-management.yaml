# Module: academics-management — Prefix: Academics

  AcademicsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-academics-${Environment}'
      CodeUri: src/app-modules/academics-management/
      Handler: functions/handler.handler
      Layers:
        - !Ref CommonLayer
        - !Ref PackagesLayer
      Environment:
        Variables:
          BUCKET_NAME: !Ref AppBucket
      Policies:
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref AppEventBus
        - SSMParameterReadPolicy:
            ParameterName: !Sub '${ProjectName}/${Environment}/*'
        - S3ReadPolicy:
            BucketName: !Ref AppBucket
      Tags:
        Environment: !Ref Environment
        ModuleName: academics-management
        ManagedBy: CloudFormation

  AcademicsDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      Name: AcademicsDataSource
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt AppSyncServiceRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !GetAtt AcademicsFunction.Arn

  # Scheme Syllabus Resolvers
  AcademicsListSchemeSyllabusResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Query
      FieldName: listSchemeSyllabus
      DataSourceName: !GetAtt AcademicsDataSource.Name
      Kind: UNIT
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      CodeS3Location: src/app-modules/academics-management/resolvers/listSchemeSyllabus.js

  AcademicsCreateSchemeSyllabusResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Mutation
      FieldName: createSchemeSyllabus
      DataSourceName: !GetAtt AcademicsDataSource.Name
      Kind: UNIT
      Runtime:
