        RuntimeVersion: 1.0.0
      CodeS3Location: src/app-modules/academics-management/resolvers/createSchemeSyllabus.js

  AcademicsUpdateSchemeSyllabusResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
