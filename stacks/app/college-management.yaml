# Module: college-management — Prefix: College

  CollegeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-college-${Environment}'
      CodeUri: src/app-modules/college-management/
      Handler: functions/handler.handler
      Layers:
        - !Ref CommonLayer
        - !Ref PackagesLayer
      Environment:
        Variables:
          BUCKET_NAME: !Ref AppBucket
      Policies:
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref AppEventBus
        - SSMParameterReadPolicy:
            ParameterName: !Sub '${ProjectName}/${Environment}/*'
        - S3ReadPolicy:
            BucketName: !Ref AppBucket
      Tags:
        Environment: !Ref Environment
        ModuleName: college-management
        ManagedBy: CloudFormation

  CollegeDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      Name: CollegeDataSource
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt AppSyncServiceRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !GetAtt CollegeFunction.Arn

  CollegeGetCollegeProfileResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Query
      FieldName: getCollegeProfile
      DataSourceName: !GetAtt CollegeDataSource.Name
      Kind: UNIT
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      CodeS3Location: src/app-modules/college-management/resolvers/getCollegeProfile.js

  CollegeUpsertCollegeProfileResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Mutation
      FieldName: upsertCollegeProfile
      DataSourceName: !GetAtt CollegeDataSource.Name
      Kind: UNIT
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      CodeS3Location: src/app-modules/college-management/resolvers/upsertCollegeProfile.js
