
  DeptAcademicsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-dept-academics-${Environment}'
      CodeUri: src/app-modules/dept-academics-management/
      Handler: functions/handler.handler
      Layers:
        - !Ref CommonLayer
        - !Ref PackagesLayer
      Policies:
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref AppEventBus
        - SSMParameterReadPolicy:
            ParameterName: !Sub '${ProjectName}/${Environment}/*'
      Tags:
        Environment: !Ref Environment
        ModuleName: dept-academics-management
        ManagedBy: CloudFormation

  DeptAcademicsDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      Name: DeptAcademicsDataSource
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt AppSyncServiceRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !GetAtt DeptAcademicsFunction.Arn

  DeptAcademicsGetDeptCourseResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Query
      FieldName: getDeptCourse
      DataSourceName: !GetAtt DeptAcademicsDataSource.Name
      Kind: UNIT
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      CodeS3Location: src/app-modules/dept-academics-management/resolvers/getDeptCourse.js

  DeptAcademicsListDeptCoursesResolver:
