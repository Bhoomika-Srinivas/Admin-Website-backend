
  EventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-events-${Environment}'
      CodeUri: src/app-modules/events-management/
      Handler: functions/handler.handler
      Layers:
        - !Ref CommonLayer
        - !Ref PackagesLayer
      Environment:
        Variables:
          BUCKET_NAME: !Ref AppBucket
      Policies:
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref AppEventBus
        - SSMParameterReadPolicy:
            ParameterName: !Sub '${ProjectName}/${Environment}/*'
        - S3ReadPolicy:
            BucketName: !Ref AppBucket
      Tags:
        Environment: !Ref Environment
        ModuleName: events-management
        ManagedBy: CloudFormation

  EventsSchedulerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-events-scheduler-${Environment}'
      CodeUri: src/app-modules/events-management/
      Handler: functions/scheduler.handler
      Layers:
        - !Ref CommonLayer
        - !Ref PackagesLayer
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub '${ProjectName}/${Environment}/*'
      Events:
        HourlySchedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Enabled: true
      Tags:
        Environment: !Ref Environment
        ModuleName: events-management
        ManagedBy: CloudFormation

  EventsDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      Name: EventsDataSource
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt AppSyncServiceRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !GetAtt EventsFunction.Arn

  EventsListEventsResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Query
      FieldName: listEvents
      DataSourceName: !GetAtt EventsDataSource.Name
      Kind: UNIT
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      CodeS3Location: src/app-modules/events-management/resolvers/listEvents.js

