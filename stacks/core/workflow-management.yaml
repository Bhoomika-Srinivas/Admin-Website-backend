# workflow-management. AppSyncServiceRole gets WorkflowFunction.Arn
  WorkflowFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-workflow-${Environment}'
      CodeUri: src/core-modules/workflow-management/
      Handler: functions/handler.handler
      Layers:
        - !Ref CommonLayer
        - !Ref PackagesLayer
      Policies:
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref AppEventBus
        - SSMParameterReadPolicy:
            ParameterName: !Sub '${ProjectName}/${Environment}/*'
      Tags:
        Environment: !Ref Environment
        ModuleName: workflow-management

  WorkflowDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      Name: WorkflowDataSource
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt AppSyncServiceRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !GetAtt WorkflowFunction.Arn

  WorkflowGetResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Query
      FieldName: getWorkflow
      DataSourceName: !GetAtt WorkflowDataSource.Name
      Kind: UNIT
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      CodeS3Location: src/core-modules/workflow-management/resolvers/getWorkflow.js

  WorkflowListResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Query
      FieldName: listWorkflows
      DataSourceName: !GetAtt WorkflowDataSource.Name
      Kind: UNIT
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      CodeS3Location: src/core-modules/workflow-management/resolvers/listWorkflows.js

  WorkflowListInstancesResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Query
      FieldName: listWorkflowInstances
      DataSourceName: !GetAtt WorkflowDataSource.Name
      Kind: UNIT
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      CodeS3Location: src/core-modules/workflow-management/resolvers/listWorkflowInstances.js
