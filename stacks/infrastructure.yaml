# Infrastructure resources: layers, event bus, queue, bucket, Cognito, AppSync API and schema.
# AppSyncServiceRole is generated by compose-template.sh from enabled modules.

  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub '${ProjectName}-common-layer-${Environment}'
      ContentUri: src/layers/common/
      CompatibleRuntimes:
        - nodejs20.x
    Metadata:
      BuildMethod: nodejs20.x

  PackagesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub '${ProjectName}-packages-layer-${Environment}'
      ContentUri: src/layers/packages/
      CompatibleRuntimes:
        - nodejs20.x
    Metadata:
      BuildMethod: nodejs20.x

  # KMS Key for encryption at rest
  AppKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub 'KMS key for ${ProjectName} ${Environment}'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'

  AppKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${ProjectName}-${Environment}'
      TargetKeyId: !Ref AppKmsKey

  AppEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub '${ProjectName}-event-bus-${Environment}'
      # EventBridge encryption at rest

  AppQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-queue-${Environment}'
      VisibilityTimeout: 300

  # S3 Access Logs Bucket (must be separate and unencrypted for logging)
  AppLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-access-logs-${Environment}-${AWS::AccountId}'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldLogs
            Status: Enabled
            ExpirationInDays: 90

  AppLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AppLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: S3ServerAccessLogsPolicy
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action:
              - s3:PutObject
            Resource: !Sub '${AppLogsBucket.Arn}/access-logs/*'
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub '${AppBucket.Arn}'

  AppBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-storage-${Environment}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  AppBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AppBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyUnencryptedConnections
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub '${AppBucket.Arn}'
              - !Sub '${AppBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: RequireKMSForPut
            Effect: Deny
            Principal: '*'
            Action: 's3:PutObject'
            Resource: !Sub '${AppBucket.Arn}/*'
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption: 'aws:kms'

  UserDefineAuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-user-define-auth-${Environment}'
      CodeUri: src/core-modules/user-management/
      Handler: functions/define-auth-challenge.handler
      Layers:
        - !Ref CommonLayer
        - !Ref PackagesLayer
      Tags:
        Environment: !Ref Environment
        ModuleName: user-management

  UserCreateAuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-user-create-auth-${Environment}'
      CodeUri: src/core-modules/user-management/
      Handler: functions/create-auth-challenge.handler
      Layers:
        - !Ref CommonLayer
        - !Ref PackagesLayer
      Environment:
        Variables:
          BREVO_USER: !Sub '{{resolve:ssm:/${ProjectName}/${Environment}/brevo-user}}'
          BREVO_PASS: !Sub '{{resolve:ssm:/${ProjectName}/${Environment}/brevo-pass}}'
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: '*'
      Tags:
        Environment: !Ref Environment
        ModuleName: user-management

  UserVerifyAuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-user-verify-auth-${Environment}'
      CodeUri: src/core-modules/user-management/
      Handler: functions/verify-auth-challenge.handler
      Layers:
        - !Ref CommonLayer
        - !Ref PackagesLayer
      Tags:
        Environment: !Ref Environment
        ModuleName: user-management

  UserPreSignupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-user-presignup-${Environment}'
      CodeUri: src/core-modules/user-management/
      Handler: functions/pre-signup.handler
      Layers:
        - !Ref CommonLayer
        - !Ref PackagesLayer
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub '${ProjectName}/${Environment}/*'
        - Statement:
            - Effect: Allow
              Action:
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
              Resource: '*'
      Tags:
        Environment: !Ref Environment
        ModuleName: user-management

  UserPostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-user-postconfirmation-${Environment}'
      CodeUri: src/core-modules/user-management/
      Handler: functions/post-confirmation.handler
      Layers:
        - !Ref CommonLayer
        - !Ref PackagesLayer
      Policies:
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref AppEventBus
        - SSMParameterReadPolicy:
            ParameterName: !Sub '${ProjectName}/${Environment}/*'
        - Statement:
            - Effect: Allow
              Action:
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
              Resource: '*'
      Tags:
        Environment: !Ref Environment
        ModuleName: user-management

  UserPreTokenGenFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-user-pretoken-${Environment}'
      CodeUri: src/core-modules/user-management/
      Handler: functions/pre-token-gen.handler
      Layers:
        - !Ref CommonLayer
        - !Ref PackagesLayer
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub '${ProjectName}/${Environment}/*'
        - Statement:
            - Effect: Allow
              Action:
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
              Resource: '*'
      Tags:
        Environment: !Ref Environment
        ModuleName: user-management

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    DependsOn:
      - UserPreSignupFunction
      - UserPostConfirmationFunction
      - UserPreTokenGenFunction
      - UserDefineAuthFunction
      - UserCreateAuthFunction
      - UserVerifyAuthFunction
    Properties:
      UserPoolName: !Sub '${ProjectName}-user-pool-${Environment}'
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Schema:
        - Name: email
          Required: true
          Mutable: false
        - Name: tenant_id
          AttributeDataType: String
          Mutable: true
          DeveloperOnlyAttribute: false
      LambdaConfig:
        PreSignUp: !GetAtt UserPreSignupFunction.Arn
        PostConfirmation: !GetAtt UserPostConfirmationFunction.Arn
        PreTokenGeneration: !GetAtt UserPreTokenGenFunction.Arn
        DefineAuthChallenge: !GetAtt UserDefineAuthFunction.Arn
        CreateAuthChallenge: !GetAtt UserCreateAuthFunction.Arn
        VerifyAuthChallengeResponse: !GetAtt UserVerifyAuthFunction.Arn

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${ProjectName}-client-${Environment}'
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_CUSTOM_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  CognitoPreSignupPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UserPreSignupFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt CognitoUserPool.Arn

  CognitoPostConfirmationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UserPostConfirmationFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt CognitoUserPool.Arn

  CognitoPreTokenGenPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UserPreTokenGenFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt CognitoUserPool.Arn

  CognitoDefineAuthPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UserDefineAuthFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt CognitoUserPool.Arn

  CognitoCreateAuthPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UserCreateAuthFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt CognitoUserPool.Arn

  CognitoVerifyAuthPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UserVerifyAuthFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt CognitoUserPool.Arn

  AppSyncApi:
    Type: AWS::AppSync::GraphQLApi
    Properties:
      Name: !Sub '${ProjectName}-api-${Environment}'
      AuthenticationType: AMAZON_COGNITO_USER_POOLS
      UserPoolConfig:
        UserPoolId: !Ref CognitoUserPool
        AwsRegion: !Ref AWS::Region
        DefaultAction: ALLOW
      AdditionalAuthenticationProviders:
        - AuthenticationType: AWS_IAM

  AppSyncLoggingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-appsync-logs-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: appsync.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppSyncPushToCloudWatchLogs

  AppSyncSchema:
    Type: AWS::AppSync::GraphQLSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      # Inlined by compose-template.sh from schema.graphql (or schema.<app>.graphql) so CFN always updates when schema changes
      Definition: INLINE_SCHEMA_PLACEHOLDER

  # CloudWatch Log Groups with retention for compliance
  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}'
      RetentionInDays: 90

  AppSyncLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/appsync/apis/${AppSyncApi.ApiId}'
      RetentionInDays: 90

  # CloudTrail for API auditing (compliance requirement)
  AuditBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-cloudtrail-${Environment}-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldTrails
            Status: Enabled
            ExpirationInDays: 365

  AuditBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AuditBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt AuditBucket.Arn
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${AuditBucket.Arn}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control

  CloudTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn: AuditBucketPolicy
    Properties:
      TrailName: !Sub '${ProjectName}-trail-${Environment}'
      S3BucketName: !Ref AuditBucket
      IsLogging: true
      IncludeGlobalServiceEvents: true
      IsMultiRegionTrail: true
      EnableLogFileValidation: true
      EventSelectors:
        - ReadWriteType: All
          IncludeManagementEvents: true
          DataResources:
            - Type: AWS::S3::Object
              Values:
                - !Sub '${AppBucket.Arn}/'
            - Type: AWS::Lambda::Function
              Values:
                - arn:aws:lambda

  # Security Hub for compliance monitoring
  SecurityHub:
    Type: AWS::SecurityHub::Hub
    Properties:
      EnableDefaultStandards: true

  # GuardDuty for threat detection
  GuardDutyDetector:
    Type: AWS::GuardDuty::Detector
    Properties:
      FindingPublishingFrequency: FIFTEEN_MINUTES
      Enable: true
      DataSources:
        S3Logs:
          Enable: true
        Kubernetes:
          AuditLogs:
            Enable: false

  # AWS Config for configuration compliance
  ConfigRecorder:
    Type: AWS::Config::ConfigurationRecorder
    Properties:
      RecordingGroup:
        AllSupported: true
        IncludeGlobalResourceTypes: true
      RoleARN: !GetAtt ConfigRole.Arn

  ConfigDeliveryChannel:
    Type: AWS::Config::DeliveryChannel
    Properties:
      ConfigSnapshotDeliveryProperties:
        DeliveryFrequency: One_Hour
      S3BucketName: !Ref AuditBucket
      SnsTopicARN: !Ref ConfigTopic

  ConfigRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess
      Policies:
        - PolicyName: ConfigDelivery
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetBucketAcl
                Resource:
                  - !GetAtt AuditBucket.Arn
                  - !Sub '${AuditBucket.Arn}/*'
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref ConfigTopic

  ConfigTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-config-${Environment}'
      KmsMasterKeyId: !Ref AppKmsKey

  # Backup Vault for disaster recovery
  BackupVault:
    Type: AWS::Backup::BackupVault
    Properties:
      BackupVaultName: !Sub '${ProjectName}-vault-${Environment}'
      EncryptionKeyArn: !GetAtt AppKmsKey.Arn

  BackupPlan:
    Type: AWS::Backup::BackupPlan
    Properties:
      BackupPlan:
        BackupPlanName: !Sub '${ProjectName}-plan-${Environment}'
        BackupPlanRule:
          - RuleName: DailyBackups
            TargetBackupVault: !Ref BackupVault
            ScheduleExpression: cron(0 5 ? * * *)
            StartWindowMinutes: 60
            CompletionWindowMinutes: 120
            Lifecycle:
              DeleteAfterDays: 35
            RecoveryPointTags:
              Project: !Ref ProjectName
              Environment: !Ref Environment
