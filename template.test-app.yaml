AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  ProjectName:
    Type: String
    Default: test-app
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]
    Default: dev

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    Environment:
      Variables:
        STAGE: !Ref Environment
        PROJECT_NAME: !Ref ProjectName
        EVENT_BUS_NAME: !Ref AppEventBus
        MONGODB_SSM_PARAM_NAME: !Sub '/${ProjectName}/${Environment}/mongodb/uri'
        MONGODB_DB_NAME: !Sub '${ProjectName}_${Environment}'

Resources:
# Infrastructure resources: layers, event bus, queue, bucket, Cognito, AppSync API and schema.
# AppSyncServiceRole is generated by compose-template.sh from enabled modules.
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub '${ProjectName}-common-layer-${Environment}'
      ContentUri: src/layers/common/
      CompatibleRuntimes:
        - nodejs20.x
    Metadata:
      BuildMethod: nodejs20.x

  PackagesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub '${ProjectName}-packages-layer-${Environment}'
      ContentUri: src/layers/packages/
      CompatibleRuntimes:
        - nodejs20.x
    Metadata:
      BuildMethod: nodejs20.x

  AppEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub '${ProjectName}-event-bus-${Environment}'

  AppQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-queue-${Environment}'
      VisibilityTimeout: 300

  AppBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-storage-${Environment}-${AWS::AccountId}'

  UserPreSignupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-user-presignup-${Environment}'
      CodeUri: src/core-modules/user-management/
      Handler: functions/pre-signup.handler
      Layers:
        - !Ref CommonLayer
        - !Ref PackagesLayer
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub '${ProjectName}/${Environment}/*'
      Tags:
        Environment: !Ref Environment
        ModuleName: user-management

  UserPostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-user-postconfirmation-${Environment}'
      CodeUri: src/core-modules/user-management/
      Handler: functions/post-confirmation.handler
      Layers:
        - !Ref CommonLayer
        - !Ref PackagesLayer
      Policies:
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref AppEventBus
        - SSMParameterReadPolicy:
            ParameterName: !Sub '${ProjectName}/${Environment}/*'
      Tags:
        Environment: !Ref Environment
        ModuleName: user-management

  UserPreTokenGenFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-user-pretoken-${Environment}'
      CodeUri: src/core-modules/user-management/
      Handler: functions/pre-token-gen.handler
      Layers:
        - !Ref CommonLayer
        - !Ref PackagesLayer
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub '${ProjectName}/${Environment}/*'
      Tags:
        Environment: !Ref Environment
        ModuleName: user-management

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    DependsOn:
      - UserPreSignupFunction
      - UserPostConfirmationFunction
      - UserPreTokenGenFunction
    Properties:
      UserPoolName: !Sub '${ProjectName}-user-pool-${Environment}'
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Schema:
        - Name: email
          Required: true
          Mutable: false
        - Name: tenant_id
          AttributeDataType: String
          Mutable: true
          DeveloperOnlyAttribute: false
      LambdaConfig:
        PreSignUp: !GetAtt UserPreSignupFunction.Arn
        PostConfirmation: !GetAtt UserPostConfirmationFunction.Arn
        PreTokenGeneration: !GetAtt UserPreTokenGenFunction.Arn

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${ProjectName}-client-${Environment}'
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  CognitoPreSignupPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UserPreSignupFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt CognitoUserPool.Arn

  CognitoPostConfirmationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UserPostConfirmationFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt CognitoUserPool.Arn

  CognitoPreTokenGenPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UserPreTokenGenFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt CognitoUserPool.Arn

  AppSyncApi:
    Type: AWS::AppSync::GraphQLApi
    Properties:
      Name: !Sub '${ProjectName}-api-${Environment}'
      AuthenticationType: AMAZON_COGNITO_USER_POOLS
      UserPoolConfig:
        UserPoolId: !Ref CognitoUserPool
        AwsRegion: !Ref AWS::Region
        DefaultAction: ALLOW
      AdditionalAuthenticationProviders:
        - AuthenticationType: AWS_IAM

  AppSyncSchema:
    Type: AWS::AppSync::GraphQLSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      # Inlined by compose-template.sh from schema.graphql (or schema.<app>.graphql) so CFN always updates when schema changes
      Definition: |
        scalar AWSDateTime
        scalar AWSJSON
        
        type PageInfo {
          hasNextPage: Boolean!
          endCursor: String
        }
        
        type MutationResponse {
          success: Boolean!
          message: String
        }
        
        input PaginationInput {
          limit: Int
          cursor: String
        }
        
        type Query { _empty: String }
        type Mutation { _empty: String }
        
        # module: tenant-management
        enum TenantPlan {
          free
          starter
          pro
          enterprise
        }
        
        enum TenantStatus {
          active
          suspended
          archived
        }
        
        type TenantConfig {
          features_enabled: [String]
          max_users: Int
          branding: TenantBranding
        }
        
        type TenantBranding {
          logo_url: String
          primary_color: String
        }
        
        type Tenant {
          tenant_id: ID!
          name: String!
          slug: String!
          plan: TenantPlan!
          status: TenantStatus!
          config: TenantConfig
          owner_user_id: String
          created_by: String
          created_at: AWSDateTime
          updated_at: AWSDateTime
        }
        
        type TenantConnection {
          items: [Tenant!]!
          nextCursor: String
        }
        
        input CreateTenantInput {
          name: String!
          slug: String
          plan: TenantPlan
          owner_user_id: String
          config: TenantConfigInput
        }
        
        input TenantConfigInput {
          features_enabled: [String]
          max_users: Int
          branding: TenantBrandingInput
        }
        
        input TenantBrandingInput {
          logo_url: String
          primary_color: String
        }
        
        input UpdateTenantInput {
          name: String
          slug: String
          plan: TenantPlan
          config: TenantConfigInput
        }
        
        extend type Query {
          getTenant(tenant_id: ID!): Tenant
          listTenants(pagination: PaginationInput): TenantConnection
        }
        
        extend type Mutation {
          createTenant(input: CreateTenantInput!): Tenant
          updateTenant(tenant_id: ID!, input: UpdateTenantInput!): Tenant
          suspendTenant(tenant_id: ID!): Tenant
        }
        
        # module: user-management
        enum UserStatus {
          active
          invited
          suspended
          deactivated
        }
        
        type User {
          user_id: ID!
          tenant_id: ID!
          email: String!
          name: String
          status: UserStatus!
          roles: [String!]
          profile: AWSJSON
          created_at: AWSDateTime
          updated_at: AWSDateTime
        }
        
        type UserConnection {
          items: [User!]!
          nextCursor: String
        }
        
        type Role {
          role_id: ID!
          tenant_id: ID!
          name: String!
          description: String
          permissions: [String!]
          is_system: Boolean
          created_at: AWSDateTime
          updated_at: AWSDateTime
        }
        
        type RoleConnection {
          items: [Role!]!
          nextCursor: String
        }
        
        input UpdateUserInput {
          name: String
          profile: AWSJSON
          status: UserStatus
        }
        
        input InviteUserInput {
          email: String!
          name: String
        }
        
        input CreateRoleInput {
          name: String!
          description: String
          permissions: [String!]
        }
        
        input UpdateRoleInput {
          name: String
          description: String
          permissions: [String!]
        }
        
        extend type Query {
          getUser(user_id: ID!): User
          listUsers(pagination: PaginationInput): UserConnection
          listRoles(pagination: PaginationInput): RoleConnection
        }
        
        extend type Mutation {
          updateUser(user_id: ID!, input: UpdateUserInput!): User
          inviteUser(input: InviteUserInput!): User
          deactivateUser(user_id: ID!): User
          createRole(input: CreateRoleInput!): Role
          updateRole(role_id: ID!, input: UpdateRoleInput!): Role
          assignRole(user_id: ID!, role_id: ID!): User
          removeRole(user_id: ID!, role_id: ID!): User
        }
        
        # module: audit-log
        type AuditEntry {
          entry_id: ID!
          tenant_id: ID!
          actor_id: String
          actor_email: String
          action: String!
          resource_type: String
          resource_id: String
          before: AWSJSON
          after: AWSJSON
          metadata: AuditMetadata
          timestamp: AWSDateTime
        }
        
        type AuditMetadata {
          ip: String
          user_agent: String
          source: String
          detail_type: String
        }
        
        type AuditEntryConnection {
          items: [AuditEntry!]!
          nextCursor: String
        }
        
        input AuditEntryFilter {
          action: String
          resource_type: String
          actor_id: String
          from: AWSDateTime
          to: AWSDateTime
        }
        
        extend type Query {
          getAuditEntry(entry_id: ID!): AuditEntry
          listAuditEntries(filter: AuditEntryFilter, pagination: PaginationInput): AuditEntryConnection
        }
        
# tenant-management: Lambda, DataSource, Resolvers. AppSyncServiceRole gets TenantFunction.Arn
  TenantFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-tenant-${Environment}'
      CodeUri: src/core-modules/tenant-management/
      Handler: functions/handler.handler
      Layers:
        - !Ref CommonLayer
        - !Ref PackagesLayer
      Environment:
        Variables:
          BUCKET_NAME: !Ref AppBucket
          QUEUE_URL: !GetAtt AppQueue.QueueUrl
      Policies:
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref AppEventBus
        - SSMParameterReadPolicy:
            ParameterName: !Sub '${ProjectName}/${Environment}/*'
      Tags:
        Environment: !Ref Environment
        ModuleName: tenant-management
        ManagedBy: CloudFormation

  TenantDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      Name: TenantDataSource
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt AppSyncServiceRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !GetAtt TenantFunction.Arn

  TenantGetResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Query
      FieldName: getTenant
      DataSourceName: !GetAtt TenantDataSource.Name
      Kind: UNIT
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      CodeUri: src/core-modules/tenant-management/resolvers/getTenant.js

  TenantListResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Query
      FieldName: listTenants
      DataSourceName: !GetAtt TenantDataSource.Name
      Kind: UNIT
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      CodeUri: src/core-modules/tenant-management/resolvers/listTenants.js

  TenantCreateResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Mutation
      FieldName: createTenant
      DataSourceName: !GetAtt TenantDataSource.Name
      Kind: UNIT
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      CodeUri: src/core-modules/tenant-management/resolvers/createTenant.js

  TenantUpdateResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Mutation
      FieldName: updateTenant
      DataSourceName: !GetAtt TenantDataSource.Name
      Kind: UNIT
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      CodeUri: src/core-modules/tenant-management/resolvers/updateTenant.js

  TenantSuspendResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Mutation
      FieldName: suspendTenant
      DataSourceName: !GetAtt TenantDataSource.Name
      Kind: UNIT
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      CodeUri: src/core-modules/tenant-management/resolvers/suspendTenant.js
