      Kind: UNIT
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      CodeUri: src/core-modules/user-management/resolvers/assignRole.js

  UserRemoveRoleResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Mutation
      FieldName: removeRole
      DataSourceName: !GetAtt UserDataSource.Name
      Kind: UNIT
