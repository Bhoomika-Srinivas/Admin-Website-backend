        RuntimeVersion: 1.0.0
      CodeUri: src/core-modules/user-management/resolvers/removeRole.js
# audit-log: AuditWriter (EventBridge), AuditQuery (AppSync), DataSource, Resolvers. AppSyncServiceRole gets AuditQueryFunction.Arn
  AuditWriterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-audit-writer-${Environment}'
      CodeUri: src/core-modules/audit-log/
      Handler: functions/audit-writer.handler
      Layers:
        - !Ref CommonLayer
        - !Ref PackagesLayer
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub '${ProjectName}/${Environment}/*'
      Tags:
        Environment: !Ref Environment
        ModuleName: audit-log

  AuditWriterEventRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref AppEventBus
      Name: !Sub '${ProjectName}-audit-all-events-${Environment}'
      Description: Send all app events to audit writer
      EventPattern:
        source:
          - prefix: !Sub '${ProjectName}.'
      State: ENABLED
      Targets:
        - Id: AuditWriterTarget
          Arn: !GetAtt AuditWriterFunction.Arn

  AuditWriterPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuditWriterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt AuditWriterEventRule.Arn

  AuditQueryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-audit-query-${Environment}'
      CodeUri: src/core-modules/audit-log/
      Handler: functions/audit-query.handler
      Layers:
        - !Ref CommonLayer
        - !Ref PackagesLayer
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub '${ProjectName}/${Environment}/*'
      Tags:
        Environment: !Ref Environment
        ModuleName: audit-log
        ManagedBy: CloudFormation

  AuditDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      Name: AuditDataSource
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt AppSyncServiceRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !GetAtt AuditQueryFunction.Arn

  AuditGetResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Query
      FieldName: getAuditEntry
      DataSourceName: !GetAtt AuditDataSource.Name
      Kind: UNIT
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      CodeUri: src/core-modules/audit-log/resolvers/getAuditEntry.js

  AuditListResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Query
      FieldName: listAuditEntries
      DataSourceName: !GetAtt AuditDataSource.Name
      Kind: UNIT
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      CodeUri: src/core-modules/audit-log/resolvers/listAuditEntries.js
  AppSyncServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: appsync.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeModuleLambdas
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt TenantFunction.Arn
                  - !GetAtt UserFunction.Arn
                  - !GetAtt AuditQueryFunction.Arn

Outputs:
  CognitoUserPoolId:
    Value: !Ref CognitoUserPool
  CognitoUserPoolClientId:
    Value: !Ref CognitoUserPoolClient
  AppSyncApiUrl:
    Value: !GetAtt AppSyncApi.GraphQLUrl
  AppSyncApiId:
    Value: !GetAtt AppSyncApi.ApiId
  SQSQueueUrl:
    Value: !GetAtt AppQueue.QueueUrl
  S3BucketName:
    Value: !Ref AppBucket
  EventBusName:
    Value: !Ref AppEventBus
