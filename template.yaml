  AppSyncServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: appsync.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeModuleLambdas
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt TenantFunction.Arn
                  - !GetAtt UserFunction.Arn
                  - !GetAtt AuditQueryFunction.Arn
                  - !GetAtt NotificationFunction.Arn
                  - !GetAtt StorageFunction.Arn
                  - !GetAtt FormFunction.Arn
                  - !GetAtt WorkflowFunction.Arn
                  - !GetAtt DeptBrandingFunction.Arn
                  - !GetAtt DeptActivitiesFunction.Arn
                  - !GetAtt DeptAcademicsFunction.Arn
                  - !GetAtt DeptResearchFunction.Arn
                  - !GetAtt DeptPeopleFunction.Arn
                  - !GetAtt DeptInfoFunction.Arn
                  - !GetAtt DepartmentFunction.Arn
                  - !GetAtt FacultyFunction.Arn

