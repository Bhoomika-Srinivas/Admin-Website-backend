AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  ProjectName:
    Type: String
    Default: myapp
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]
    Default: dev

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    Environment:
      Variables:
        STAGE: !Ref Environment
        PROJECT_NAME: !Ref ProjectName
        EVENT_BUS_NAME: !Ref AppEventBus
        MONGODB_SSM_PARAM_NAME: !Sub '/${ProjectName}/${Environment}/mongodb/uri'
        MONGODB_DB_NAME: !Sub '${ProjectName}_${Environment}'

Resources:
# Infrastructure resources: layers, event bus, queue, bucket, Cognito, AppSync API and schema.
# AppSyncServiceRole is generated by compose-template.sh from enabled modules.
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub '${ProjectName}-common-layer-${Environment}'
      ContentUri: src/layers/common/
      CompatibleRuntimes:
        - nodejs20.x
    Metadata:
      BuildMethod: nodejs20.x

  PackagesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub '${ProjectName}-packages-layer-${Environment}'
      ContentUri: src/layers/packages/
      CompatibleRuntimes:
        - nodejs20.x
    Metadata:
      BuildMethod: nodejs20.x

  AppEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub '${ProjectName}-event-bus-${Environment}'

  AppQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-queue-${Environment}'
      VisibilityTimeout: 300

  AppBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-storage-${Environment}-${AWS::AccountId}'

  UserPreSignupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-user-presignup-${Environment}'
      CodeUri: src/core-modules/user-management/
      Handler: functions/pre-signup.handler
      Layers:
        - !Ref CommonLayer
        - !Ref PackagesLayer
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub '${ProjectName}/${Environment}/*'
      Tags:
        Environment: !Ref Environment
        ModuleName: user-management

  UserPostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-user-postconfirmation-${Environment}'
      CodeUri: src/core-modules/user-management/
      Handler: functions/post-confirmation.handler
      Layers:
        - !Ref CommonLayer
        - !Ref PackagesLayer
      Policies:
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref AppEventBus
        - SSMParameterReadPolicy:
            ParameterName: !Sub '${ProjectName}/${Environment}/*'
      Tags:
        Environment: !Ref Environment
        ModuleName: user-management

  UserPreTokenGenFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-user-pretoken-${Environment}'
      CodeUri: src/core-modules/user-management/
      Handler: functions/pre-token-gen.handler
      Layers:
        - !Ref CommonLayer
        - !Ref PackagesLayer
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub '${ProjectName}/${Environment}/*'
      Tags:
        Environment: !Ref Environment
        ModuleName: user-management

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    DependsOn:
      - UserPreSignupFunction
      - UserPostConfirmationFunction
      - UserPreTokenGenFunction
    Properties:
      UserPoolName: !Sub '${ProjectName}-user-pool-${Environment}'
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Schema:
        - Name: email
          Required: true
          Mutable: false
        - Name: tenant_id
          AttributeDataType: String
          Mutable: true
          DeveloperOnlyAttribute: false
      LambdaConfig:
        PreSignUp: !GetAtt UserPreSignupFunction.Arn
        PostConfirmation: !GetAtt UserPostConfirmationFunction.Arn
        PreTokenGeneration: !GetAtt UserPreTokenGenFunction.Arn

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${ProjectName}-client-${Environment}'
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  CognitoPreSignupPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UserPreSignupFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt CognitoUserPool.Arn

  CognitoPostConfirmationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UserPostConfirmationFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt CognitoUserPool.Arn

  CognitoPreTokenGenPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UserPreTokenGenFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt CognitoUserPool.Arn

  AppSyncApi:
    Type: AWS::AppSync::GraphQLApi
    Properties:
      Name: !Sub '${ProjectName}-api-${Environment}'
      AuthenticationType: AMAZON_COGNITO_USER_POOLS
      UserPoolConfig:
        UserPoolId: !Ref CognitoUserPool
        AwsRegion: !Ref AWS::Region
        DefaultAction: ALLOW
      AdditionalAuthenticationProviders:
        - AuthenticationType: AWS_IAM

  AppSyncSchema:
    Type: AWS::AppSync::GraphQLSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      # Inlined by compose-template.sh from schema.graphql (or schema.<app>.graphql) so CFN always updates when schema changes
      Definition: |
        scalar AWSDateTime
        scalar AWSJSON
        
        type PageInfo {
          hasNextPage: Boolean!
          endCursor: String
        }
        
        type MutationResponse {
          success: Boolean!
          message: String
        }
        
        input PaginationInput {
          limit: Int
          cursor: String
        }
        
        type Query {
          _empty: String
          getAuditEntry(entry_id: ID!): AuditEntry
          listAuditEntries(filter: AuditEntryFilter, pagination: PaginationInput): AuditEntryConnection
          getForm(form_id: ID!): FormDefinition
          listForms(pagination: PaginationInput): FormDefinitionConnection
          listFormSubmissions(form_id: ID, pagination: PaginationInput): FormSubmissionConnection
          getNotificationTemplate(template_id: ID!): NotificationTemplate
          listNotificationTemplates(pagination: PaginationInput): NotificationTemplateConnection
          listNotifications(pagination: PaginationInput): NotificationConnection
          listFiles(module: String, entity_id: String, pagination: PaginationInput): FileConnection
          getTenant(tenant_id: ID!): Tenant
          listTenants(pagination: PaginationInput): TenantConnection
          getUser(user_id: ID!): User
          listUsers(pagination: PaginationInput): UserConnection
          listRoles(pagination: PaginationInput): RoleConnection
          getWorkflow(workflow_id: ID!): WorkflowDefinition
          listWorkflows(pagination: PaginationInput): WorkflowDefinitionConnection
          listWorkflowInstances(workflow_id: ID, pagination: PaginationInput): WorkflowInstanceConnection
          listAccreditationRecords(type: String!, section: String, sub_section: String, sub_sub_section: String, department: String, tenantId: ID, limit: Int, nextToken: String): AccreditationRecordList @aws_api_key @aws_cognito_user_pools
          getAccreditationRecord(accreditationId: ID!): AccreditationRecord @aws_api_key @aws_cognito_user_pools
          getAdmissionsOverview(tenantId: ID):                   AdmissionsOverview  @aws_api_key @aws_cognito_user_pools
          listAdmissionsPrograms(level: String, tenantId: ID):   [AdmissionsProgram] @aws_api_key @aws_cognito_user_pools
          listUGCourses(tenantId: ID):                           [UGCourse]          @aws_api_key @aws_cognito_user_pools
          listPGCourses(tenantId: ID):                           [PGCourse]          @aws_api_key @aws_cognito_user_pools
          listEligibilityEntries(tenantId: ID):                  [EligibilityEntry]  @aws_api_key @aws_cognito_user_pools
          listAdmissionSteps(tenantId: ID):                      [AdmissionStep]     @aws_api_key @aws_cognito_user_pools
          listImportantDates(tenantId: ID):                      [ImportantDate]     @aws_api_key @aws_cognito_user_pools
          getProspectus(tenantId: ID):                           Prospectus          @aws_api_key @aws_cognito_user_pools
          listFeeDocuments(tenantId: ID):                        [FeeDocument]       @aws_api_key @aws_cognito_user_pools
          listScholarships(tenantId: ID):                        [Scholarship]       @aws_api_key @aws_cognito_user_pools
          listAuditStatements(tenantId: ID):                     [AuditStatement]    @aws_api_key @aws_cognito_user_pools
          listAdmissionsEnquiries(status: String, tenantId: ID): [AdmissionsEnquiry] @aws_cognito_user_pools
          listAdmissionsContacts(tenantId: ID):                  [AdmissionsContact] @aws_api_key @aws_cognito_user_pools
          getWhyEnquire(tenantId: ID):                           WhyEnquire          @aws_api_key @aws_cognito_user_pools
          listEnquiryCategories(tenantId: ID):                   [EnquiryCategory]   @aws_api_key @aws_cognito_user_pools
          listInfoBlocks(tenantId: ID):                          [InfoBlock]         @aws_api_key @aws_cognito_user_pools
          getAlumni(alumniId: ID!, tenantId: ID): Alumni @aws_api_key @aws_cognito_user_pools
          listAlumni(tenantId: ID, deptId: ID, batch: String, search: String, limit: Int, nextToken: String): AlumniList @aws_api_key @aws_cognito_user_pools
          getDepartment(departmentId: ID!): Department @aws_cognito_user_pools @aws_api_key
          listDepartments(limit: Int, nextToken: String): DepartmentList @aws_cognito_user_pools @aws_api_key
          listDeptSlots(deptId: ID!, sectionId: ID!, tenantId: ID, programType: String, program: String, batch: String): DeptSlotList @aws_api_key @aws_cognito_user_pools
          listDeptSections(deptId: ID!, tenantId: ID, programId: ID, semester: Int, batchName: String): DeptSectionList @aws_api_key @aws_cognito_user_pools
          listDeptBatches(deptId: ID!, tenantId: ID, programType: String, program: String): DeptBatchList @aws_api_key @aws_cognito_user_pools
          listDeptCourses(deptId: ID!, tenantId: ID, programType: String, program: String, batch: String, semester: Int, type: String, limit: Int, nextToken: String): DeptCourseList @aws_api_key @aws_cognito_user_pools
          getDeptCourse(deptCourseId: ID!): DeptCourse @aws_api_key @aws_cognito_user_pools
          listDeptTimetables(deptId: ID!, tenantId: ID, semester: Int, academicYear: String): DeptTimetableList @aws_api_key @aws_cognito_user_pools
          listLearningMaterials(deptId: ID!, tenantId: ID, courseCode: String, type: String, limit: Int, nextToken: String): LearningMaterialList @aws_api_key @aws_cognito_user_pools
          listInnovativeTeaching(deptId: ID!, tenantId: ID): InnovativeTeachingList @aws_api_key @aws_cognito_user_pools
          listResultAnalyses(deptId: ID!, tenantId: ID, semester: Int, batch: String): ResultAnalysisList @aws_api_key @aws_cognito_user_pools
          listPlacementOverviews(deptId: ID!, tenantId: ID, academicYear: String): PlacementOverviewList @aws_api_key @aws_cognito_user_pools
          listStudentPlacements(deptId: ID!, tenantId: ID, batch: String, limit: Int, nextToken: String): StudentPlacementList @aws_api_key @aws_cognito_user_pools
          listAchievements(deptId: ID!, tenantId: ID, type: String): AchievementList @aws_api_key @aws_cognito_user_pools
          listDeptActivities(deptId: ID!, tenantId: ID, type: String, limit: Int, nextToken: String): DeptActivityList @aws_api_key @aws_cognito_user_pools
          getForumSection(deptId: ID!, tenantId: ID): ForumSection @aws_api_key @aws_cognito_user_pools
          listForumEvents(deptId: ID!, tenantId: ID, limit: Int, nextToken: String): ForumEventList @aws_api_key @aws_cognito_user_pools
          listDepartmentActivities(deptId: ID!, tenantId: ID, limit: Int, nextToken: String): DepartmentActivityLogList @aws_api_key @aws_cognito_user_pools
          listNewsletters(deptId: ID!, tenantId: ID): NewsletterList @aws_api_key @aws_cognito_user_pools
          listGalleryPhotos(deptId: ID!, tenantId: ID, category: String, limit: Int, nextToken: String): GalleryPhotoList @aws_api_key @aws_cognito_user_pools
          getDeptBranding(deptId: ID!): DeptBranding
          getInstituteSettings: InstituteSettings
          getDeptIntroduction(deptId: ID!, tenantId: ID): DeptIntroduction @aws_api_key @aws_cognito_user_pools
          getDeptAbout(deptId: ID!, tenantId: ID): DeptAbout               @aws_api_key @aws_cognito_user_pools
          getDeptSwot(deptId: ID!, tenantId: ID): DeptSwot                 @aws_api_key @aws_cognito_user_pools
          getHodProfile(deptId: ID!, tenantId: ID): HodProfile             @aws_api_key @aws_cognito_user_pools
          listProgramOutcomes(deptId: ID!, tenantId: ID, type: String, limit: Int, nextToken: String): ProgramOutcomeList @aws_api_key @aws_cognito_user_pools
          listCommitteeMembers(deptId: ID!, tenantId: ID, committee: String): CommitteeMemberList                        @aws_api_key @aws_cognito_user_pools
          listDistinguishedAlumni(deptId: ID!, tenantId: ID): DistinguishedAlumniList                                    @aws_api_key @aws_cognito_user_pools
          listDeptStaff(deptId: ID!, staffType: String, limit: Int, nextToken: String, tenantId: String): DeptStaffList @aws_api_key @aws_cognito_user_pools
          getDeptStaff(deptStaffId: ID!): DeptStaff @aws_api_key @aws_cognito_user_pools
          listAccreditations(deptId: ID!, status: String, limit: Int, nextToken: String): AccreditationList @aws_api_key @aws_cognito_user_pools
          getAccreditation(accreditationId: ID!): Accreditation @aws_api_key @aws_cognito_user_pools
          listPublicationProfiles(deptId: ID!, tenantId: ID): PublicationProfileList @aws_api_key @aws_cognito_user_pools
          listResearchGrants(deptId: ID!, tenantId: ID): ResearchGrantList @aws_api_key @aws_cognito_user_pools
          listPatents(deptId: ID!, tenantId: ID): PatentList @aws_api_key @aws_cognito_user_pools
          listFacultyResearchSummaries(deptId: ID!, tenantId: ID, limit: Int, nextToken: String): FacultyResearchSummaryList @aws_api_key @aws_cognito_user_pools
          listPhdGuides(deptId: ID!, tenantId: ID): PhdGuideList @aws_api_key @aws_cognito_user_pools
          listPhdScholars(deptId: ID!, tenantId: ID, guideFacultyId: ID, status: String): PhdScholarList @aws_api_key @aws_cognito_user_pools
          listEvents(deptId: ID, tenantId: ID, level: String, department: String, status: String, approvalStatus: String, pinned: Boolean, limit: Int, nextToken: String): EventList @aws_api_key @aws_cognito_user_pools
          getEvent(eventId: ID!): Event @aws_api_key @aws_cognito_user_pools
          getFaculty(facultyId: ID!, tenantId: ID): Faculty @aws_api_key @aws_cognito_user_pools
          listFaculty(deptId: ID, tenantId: ID, designation: String, status: String, search: String, limit: Int, nextToken: String): FacultyList @aws_api_key @aws_cognito_user_pools
          listDesignationOptions: DesignationOptions @aws_api_key @aws_cognito_user_pools
        }
        type Mutation {
          _empty: String
          createForm(input: CreateFormInput!): FormDefinition
          publishForm(form_id: ID!): FormDefinition
          submitForm(input: SubmitFormInput!): FormSubmission
          createNotificationTemplate(input: CreateTemplateInput!): NotificationTemplate
          updateNotificationPreference(input: UpdatePreferenceInput!): NotificationPreference
          getUploadUrl(module: String, entity_id: String, extension: String): UploadUrlResult
          getDownloadUrl(key: String!): DownloadUrlResult
          deleteFile(file_id: ID!): MutationResponse
          createTenant(input: CreateTenantInput!): Tenant
          updateTenant(tenant_id: ID!, input: UpdateTenantInput!): Tenant
          suspendTenant(tenant_id: ID!): Tenant
          updateUser(user_id: ID!, input: UpdateUserInput!): User
          inviteUser(input: InviteUserInput!): User
          deactivateUser(user_id: ID!): User
          createRole(input: CreateRoleInput!): Role
          updateRole(role_id: ID!, input: UpdateRoleInput!): Role
          assignRole(user_id: ID!, role_id: ID!): User
          removeRole(user_id: ID!, role_id: ID!): User
          createAccreditationRecord(input: CreateAccreditationRecordInput!): AccreditationRecord!
          updateAccreditationRecord(input: UpdateAccreditationRecordInput!): AccreditationRecord!
          deleteAccreditationRecord(accreditationId: ID!): AccreditationRecord!
          # Singletons
          saveAdmissionsOverview(input: SaveAdmissionsOverviewInput!): AdmissionsOverview!
          saveProspectus(input: SaveProspectusInput!):                 Prospectus!
          deleteProspectus:                                            Boolean!
          saveWhyEnquire(input: SaveWhyEnquireInput!):                 WhyEnquire!
        
          # Programs
          createAdmissionsProgram(input: CreateAdmissionsProgramInput!): AdmissionsProgram!
          updateAdmissionsProgram(input: UpdateAdmissionsProgramInput!): AdmissionsProgram!
          deleteAdmissionsProgram(programId: ID!):                        AdmissionsProgram!
        
          # UG Courses
          createUGCourse(input: CreateUGCourseInput!): UGCourse!
          updateUGCourse(input: UpdateUGCourseInput!): UGCourse!
          deleteUGCourse(courseId: ID!):               UGCourse!
        
          # PG Courses
          createPGCourse(input: CreatePGCourseInput!): PGCourse!
          updatePGCourse(input: UpdatePGCourseInput!): PGCourse!
          deletePGCourse(courseId: ID!):               PGCourse!
        
          # Eligibility entries
          createEligibilityEntry(input: CreateEligibilityEntryInput!): EligibilityEntry!
          updateEligibilityEntry(input: UpdateEligibilityEntryInput!): EligibilityEntry!
          deleteEligibilityEntry(entryId: ID!):                         EligibilityEntry!
        
          # Steps
          createAdmissionStep(input: CreateAdmissionStepInput!): AdmissionStep!
          updateAdmissionStep(input: UpdateAdmissionStepInput!): AdmissionStep!
          deleteAdmissionStep(stepId: ID!):                       AdmissionStep!
          reorderAdmissionSteps(ids: [ID!]!):                     [AdmissionStep]!
        
          # Important Dates
          createImportantDate(input: CreateImportantDateInput!): ImportantDate!
          updateImportantDate(input: UpdateImportantDateInput!): ImportantDate!
          deleteImportantDate(dateId: ID!):                       ImportantDate!
        
          # Fee Documents
          createFeeDocument(input: CreateFeeDocumentInput!): FeeDocument!
          updateFeeDocument(input: UpdateFeeDocumentInput!): FeeDocument!
          deleteFeeDocument(feeDocId: ID!):                   Boolean!
        
          # Scholarships
          createScholarship(input: CreateScholarshipInput!): Scholarship!
          updateScholarship(input: UpdateScholarshipInput!): Scholarship!
          deleteScholarship(scholarshipId: ID!):              Scholarship!
        
          # Audit Statements
          createAuditStatement(input: CreateAuditStatementInput!): AuditStatement!
          deleteAuditStatement(auditId: ID!):                       Boolean!
        
          # Enquiry Categories
          createEnquiryCategory(input: CreateEnquiryCategoryInput!): EnquiryCategory!
          updateEnquiryCategory(input: UpdateEnquiryCategoryInput!): EnquiryCategory!
          deleteEnquiryCategory(categoryId: ID!):                     EnquiryCategory!
        
          # Info Blocks
          createInfoBlock(input: CreateInfoBlockInput!): InfoBlock!
          updateInfoBlock(input: UpdateInfoBlockInput!): InfoBlock!
          deleteInfoBlock(blockId: ID!):                  InfoBlock!
        
          # Enquiries & Contacts
          updateEnquiryStatus(enquiryId: ID!, status: EnquiryStatus!):                    AdmissionsEnquiry!
          updateAdmissionsContact(contactId: ID!, input: UpdateAdmissionsContactInput!): AdmissionsContact!
        
          # Public (unauthenticated)
          submitAdmissionsEnquiry(input: EnquirySubmitInput!): Boolean! @aws_api_key
          createAlumni(input: CreateAlumniInput!): Alumni
          updateAlumni(input: UpdateAlumniInput!): Alumni
          deleteAlumni(alumniId: ID!): Alumni
          createDepartment(input: CreateDepartmentInput!): Department
          updateDepartment(input: UpdateDepartmentInput!): Department
          deleteDepartment(departmentId: ID!): Department
          createDeptSlot(input: CreateDeptSlotInput!): DeptSlot
          updateDeptSlot(input: UpdateDeptSlotInput!): DeptSlot
          deleteDeptSlot(deptSlotId: ID!): DeptSlot
          createDeptSection(input: CreateDeptSectionInput!): DeptSection
          deleteDeptSection(deptSectionId: ID!): DeptSection
          createDeptBatch(input: CreateDeptBatchInput!): DeptBatch
          deleteDeptBatch(deptBatchId: ID!): DeptBatch
          createDeptCourse(input: CreateDeptCourseInput!): DeptCourse
          updateDeptCourse(input: UpdateDeptCourseInput!): DeptCourse
          deleteDeptCourse(deptCourseId: ID!): DeptCourse
        
          createDeptTimetable(input: CreateDeptTimetableInput!): DeptTimetable
          updateDeptTimetable(input: UpdateDeptTimetableInput!): DeptTimetable
          deleteDeptTimetable(deptTimetableId: ID!): DeptTimetable
        
          createLearningMaterial(input: CreateLearningMaterialInput!): LearningMaterial
          updateLearningMaterial(input: UpdateLearningMaterialInput!): LearningMaterial
          deleteLearningMaterial(learningMaterialId: ID!): LearningMaterial
        
          createInnovativeTeaching(input: CreateInnovativeTeachingInput!): InnovativeTeaching
          updateInnovativeTeaching(input: UpdateInnovativeTeachingInput!): InnovativeTeaching
          deleteInnovativeTeaching(innovativeTeachingId: ID!): InnovativeTeaching
        
          createResultAnalysis(input: CreateResultAnalysisInput!): ResultAnalysis
          updateResultAnalysis(input: UpdateResultAnalysisInput!): ResultAnalysis
          deleteResultAnalysis(resultAnalysisId: ID!): ResultAnalysis
          createPlacementOverview(input: CreatePlacementOverviewInput!): PlacementOverview
          updatePlacementOverview(input: UpdatePlacementOverviewInput!): PlacementOverview
          deletePlacementOverview(placementOverviewId: ID!): PlacementOverview
        
          createStudentPlacement(input: CreateStudentPlacementInput!): StudentPlacement
          updateStudentPlacement(input: UpdateStudentPlacementInput!): StudentPlacement
          deleteStudentPlacement(studentPlacementId: ID!): StudentPlacement
        
          createAchievement(input: CreateAchievementInput!): Achievement
          updateAchievement(input: UpdateAchievementInput!): Achievement
          deleteAchievement(achievementId: ID!): Achievement
        
          createDeptActivity(input: CreateDeptActivityInput!): DeptActivity
          updateDeptActivity(input: UpdateDeptActivityInput!): DeptActivity
          deleteDeptActivity(deptActivityId: ID!): DeptActivity
        
          saveForumSection(input: SaveForumSectionInput!): ForumSection
        
          createForumEvent(input: CreateForumEventInput!): ForumEvent
          updateForumEvent(input: UpdateForumEventInput!): ForumEvent
          deleteForumEvent(forumEventId: ID!): ForumEvent
        
          createDepartmentActivity(input: CreateDepartmentActivityInput!): DepartmentActivityLog
          updateDepartmentActivity(input: UpdateDepartmentActivityInput!): DepartmentActivityLog
          deleteDepartmentActivity(deptActivityLogId: ID!): DepartmentActivityLog
        
          createNewsletter(input: CreateNewsletterInput!): Newsletter
          updateNewsletter(input: UpdateNewsletterInput!): Newsletter
          deleteNewsletter(newsletterId: ID!): Newsletter
        
          createGalleryPhoto(input: CreateGalleryPhotoInput!): GalleryPhoto
          updateGalleryPhoto(input: UpdateGalleryPhotoInput!): GalleryPhoto
          deleteGalleryPhoto(galleryPhotoId: ID!): GalleryPhoto
          saveDeptBranding(deptId: ID!, input: SaveDeptBrandingInput!): DeptBranding
          saveInstituteSettings(input: SaveInstituteSettingsInput!): InstituteSettings
          saveDeptIntroduction(deptId: ID!, input: SaveDeptIntroductionInput!): DeptIntroduction
          saveDeptAbout(deptId: ID!, input: SaveDeptAboutInput!): DeptAbout
          saveDeptSwot(deptId: ID!, input: SaveDeptSwotInput!): DeptSwot
          saveHodProfile(deptId: ID!, input: SaveHodProfileInput!): HodProfile
        
          createProgramOutcome(input: CreateProgramOutcomeInput!): ProgramOutcome
          updateProgramOutcome(input: UpdateProgramOutcomeInput!): ProgramOutcome
          deleteProgramOutcome(programOutcomeId: ID!): ProgramOutcome
          reorderProgramOutcomes(input: ReorderProgramOutcomesInput!): Boolean
        
          createCommitteeMember(input: CreateCommitteeMemberInput!): CommitteeMember
          updateCommitteeMember(input: UpdateCommitteeMemberInput!): CommitteeMember
          deleteCommitteeMember(committeeMemberId: ID!): CommitteeMember
        
          createDistinguishedAlumnus(input: CreateDistinguishedAlumnusInput!): DistinguishedAlumnus
          updateDistinguishedAlumnus(input: UpdateDistinguishedAlumnusInput!): DistinguishedAlumnus
          deleteDistinguishedAlumnus(distinguishedAlumnusId: ID!): DistinguishedAlumnus
          createDeptStaff(input: CreateDeptStaffInput!): DeptStaff
          updateDeptStaff(input: UpdateDeptStaffInput!): DeptStaff
          deleteDeptStaff(deptStaffId: ID!): DeptStaff
        
          createAccreditation(input: CreateAccreditationInput!): Accreditation
          updateAccreditation(input: UpdateAccreditationInput!): Accreditation
          deleteAccreditation(accreditationId: ID!): Accreditation
          savePublicationProfile(input: SavePublicationProfileInput!): PublicationProfile
          deletePublicationProfile(publicationProfileId: ID!): PublicationProfile
        
          createResearchGrant(input: CreateResearchGrantInput!): ResearchGrant
          updateResearchGrant(input: UpdateResearchGrantInput!): ResearchGrant
          deleteResearchGrant(researchGrantId: ID!): ResearchGrant
        
          createPatent(input: CreatePatentInput!): Patent
          updatePatent(input: UpdatePatentInput!): Patent
          deletePatent(patentId: ID!): Patent
        
          createFacultyResearchSummary(input: CreateFacultyResearchSummaryInput!): FacultyResearchSummary
          updateFacultyResearchSummary(input: UpdateFacultyResearchSummaryInput!): FacultyResearchSummary
          deleteFacultyResearchSummary(facultyResearchSummaryId: ID!): FacultyResearchSummary
        
          createPhdGuide(input: CreatePhdGuideInput!): PhdGuide
          updatePhdGuide(input: UpdatePhdGuideInput!): PhdGuide
          deletePhdGuide(phdGuideId: ID!): PhdGuide
        
          createPhdScholar(input: CreatePhdScholarInput!): PhdScholar
          updatePhdScholar(input: UpdatePhdScholarInput!): PhdScholar
          deletePhdScholar(phdScholarId: ID!): PhdScholar
          createEvent(input: CreateEventInput!): Event
