  CognitoUserPoolClientId:
    Value: !Ref CognitoUserPoolClient
  AppSyncApiUrl:
    Value: !GetAtt AppSyncApi.GraphQLUrl
  AppSyncApiId:
    Value: !GetAtt AppSyncApi.ApiId
  SQSQueueUrl:
    Value: !GetAtt AppQueue.QueueUrl
  S3BucketName:
    Value: !Ref AppBucket
  EventBusName:
    Value: !Ref AppEventBus
