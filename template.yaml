AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  ProjectName:
    Type: String
    Default: myapp
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]
    Default: dev

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    Environment:
      Variables:
        STAGE: !Ref Environment
        PROJECT_NAME: !Ref ProjectName
        EVENT_BUS_NAME: !Ref AppEventBus
        MONGODB_SSM_PARAM_NAME: !Sub '/${ProjectName}/${Environment}/mongodb/uri'
        MONGODB_DB_NAME: !Sub '${ProjectName}_${Environment}'

Resources:
# Infrastructure resources: layers, event bus, queue, bucket, Cognito, AppSync API and schema.
# AppSyncServiceRole is generated by compose-template.sh from enabled modules.
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub '${ProjectName}-common-layer-${Environment}'
      ContentUri: src/layers/common/
      CompatibleRuntimes:
        - nodejs20.x
    Metadata:
      BuildMethod: nodejs20.x

  PackagesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub '${ProjectName}-packages-layer-${Environment}'
      ContentUri: src/layers/packages/
      CompatibleRuntimes:
        - nodejs20.x
    Metadata:
      BuildMethod: nodejs20.x

  AppEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub '${ProjectName}-event-bus-${Environment}'

  AppQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-queue-${Environment}'
      VisibilityTimeout: 300

  AppBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-storage-${Environment}-${AWS::AccountId}'

  UserPreSignupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-user-presignup-${Environment}'
      CodeUri: src/core-modules/user-management/
      Handler: functions/pre-signup.handler
      Layers:
        - !Ref CommonLayer
        - !Ref PackagesLayer
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub '${ProjectName}/${Environment}/*'
      Tags:
        Environment: !Ref Environment
        ModuleName: user-management

  UserPostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-user-postconfirmation-${Environment}'
      CodeUri: src/core-modules/user-management/
      Handler: functions/post-confirmation.handler
      Layers:
        - !Ref CommonLayer
        - !Ref PackagesLayer
      Policies:
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref AppEventBus
        - SSMParameterReadPolicy:
            ParameterName: !Sub '${ProjectName}/${Environment}/*'
      Tags:
        Environment: !Ref Environment
        ModuleName: user-management

  UserPreTokenGenFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-user-pretoken-${Environment}'
      CodeUri: src/core-modules/user-management/
      Handler: functions/pre-token-gen.handler
      Layers:
        - !Ref CommonLayer
        - !Ref PackagesLayer
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub '${ProjectName}/${Environment}/*'
      Tags:
        Environment: !Ref Environment
        ModuleName: user-management

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    DependsOn:
      - UserPreSignupFunction
      - UserPostConfirmationFunction
      - UserPreTokenGenFunction
    Properties:
      UserPoolName: !Sub '${ProjectName}-user-pool-${Environment}'
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Schema:
        - Name: email
          Required: true
          Mutable: false
        - Name: tenant_id
          AttributeDataType: String
          Mutable: true
          DeveloperOnlyAttribute: false
      LambdaConfig:
        PreSignUp: !GetAtt UserPreSignupFunction.Arn
        PostConfirmation: !GetAtt UserPostConfirmationFunction.Arn
        PreTokenGeneration: !GetAtt UserPreTokenGenFunction.Arn

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${ProjectName}-client-${Environment}'
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  CognitoPreSignupPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UserPreSignupFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt CognitoUserPool.Arn

  CognitoPostConfirmationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UserPostConfirmationFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt CognitoUserPool.Arn

  CognitoPreTokenGenPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UserPreTokenGenFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt CognitoUserPool.Arn

  AppSyncApi:
    Type: AWS::AppSync::GraphQLApi
    Properties:
      Name: !Sub '${ProjectName}-api-${Environment}'
      AuthenticationType: AMAZON_COGNITO_USER_POOLS
      UserPoolConfig:
        UserPoolId: !Ref CognitoUserPool
        AwsRegion: !Ref AWS::Region
        DefaultAction: ALLOW
      AdditionalAuthenticationProviders:
        - AuthenticationType: AWS_IAM

  AppSyncSchema:
    Type: AWS::AppSync::GraphQLSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      # Inlined by compose-template.sh from schema.graphql (or schema.<app>.graphql) so CFN always updates when schema changes
      Definition: |
        scalar AWSDateTime
        scalar AWSJSON
        
        type PageInfo {
          hasNextPage: Boolean!
          endCursor: String
        }
        
        type MutationResponse {
          success: Boolean!
          message: String
        }
        
        input PaginationInput {
          limit: Int
          cursor: String
        }
        
        type Query {
          _empty: String
          getAuditEntry(entry_id: ID!): AuditEntry
          listAuditEntries(filter: AuditEntryFilter, pagination: PaginationInput): AuditEntryConnection
          getForm(form_id: ID!): FormDefinition
          listForms(pagination: PaginationInput): FormDefinitionConnection
          listFormSubmissions(form_id: ID, pagination: PaginationInput): FormSubmissionConnection
          getNotificationTemplate(template_id: ID!): NotificationTemplate
          listNotificationTemplates(pagination: PaginationInput): NotificationTemplateConnection
          listNotifications(pagination: PaginationInput): NotificationConnection
          listFiles(module: String, entity_id: String, pagination: PaginationInput): FileConnection
          getTenant(tenant_id: ID!): Tenant
          listTenants(pagination: PaginationInput): TenantConnection
          getUser(user_id: ID!): User
          listUsers(pagination: PaginationInput): UserConnection
          listRoles(pagination: PaginationInput): RoleConnection
          getWorkflow(workflow_id: ID!): WorkflowDefinition
          listWorkflows(pagination: PaginationInput): WorkflowDefinitionConnection
          listWorkflowInstances(workflow_id: ID, pagination: PaginationInput): WorkflowInstanceConnection
          getDepartment(departmentId: ID!): Department
          listDepartments(limit: Int, nextToken: String): DepartmentList
          listDeptCourses(deptId: ID!, semester: Int, type: String, limit: Int, nextToken: String): DeptCourseList
          getDeptCourse(deptCourseId: ID!): DeptCourse
          listDeptTimetables(deptId: ID!, semester: Int, academicYear: String): DeptTimetableList
          listLearningMaterials(deptId: ID!, courseCode: String, type: String, limit: Int, nextToken: String): LearningMaterialList
          listInnovativeTeaching(deptId: ID!): InnovativeTeachingList
          listResultAnalyses(deptId: ID!, semester: Int, batch: String): ResultAnalysisList
          listPlacementOverviews(deptId: ID!, academicYear: String): PlacementOverviewList
          listStudentPlacements(deptId: ID!, batch: String, limit: Int, nextToken: String): StudentPlacementList
          listAchievements(deptId: ID!, type: String): AchievementList
          listDeptActivities(deptId: ID!, type: String, limit: Int, nextToken: String): DeptActivityList
          getForumSection(deptId: ID!): ForumSection
          listForumEvents(deptId: ID!, limit: Int, nextToken: String): ForumEventList
          listDepartmentActivities(deptId: ID!, limit: Int, nextToken: String): DepartmentActivityLogList
          listNewsletters(deptId: ID!): NewsletterList
          listGalleryPhotos(deptId: ID!, category: String, limit: Int, nextToken: String): GalleryPhotoList
          getDeptBranding(deptId: ID!): DeptBranding
          getInstituteSettings: InstituteSettings
          getDeptIntroduction(deptId: ID!): DeptIntroduction
          getDeptAbout(deptId: ID!): DeptAbout
          getDeptSwot(deptId: ID!): DeptSwot
          getHodProfile(deptId: ID!): HodProfile
          listProgramOutcomes(deptId: ID!, type: String, limit: Int, nextToken: String): ProgramOutcomeList
          listCommitteeMembers(deptId: ID!, committee: String): CommitteeMemberList
          listDistinguishedAlumni(deptId: ID!): DistinguishedAlumniList
          listDeptStaff(deptId: ID!, status: String, limit: Int, nextToken: String): DeptStaffList
          getDeptStaff(deptStaffId: ID!): DeptStaff
          listAccreditations(deptId: ID!, status: String, limit: Int, nextToken: String): AccreditationList
          getAccreditation(accreditationId: ID!): Accreditation
          listDeptPublications(deptId: ID!, type: String, year: Int, limit: Int, nextToken: String): DeptPublicationList
          listPublicationProfiles(deptId: ID!): PublicationProfileList
          listResearchGrants(deptId: ID!): ResearchGrantList
          listPatents(deptId: ID!): PatentList
          listFacultyResearchSummaries(deptId: ID!, limit: Int, nextToken: String): FacultyResearchSummaryList
          listPhdGuides(deptId: ID!): PhdGuideList
          listPhdScholars(deptId: ID!, guideFacultyId: ID, status: String): PhdScholarList
          getFaculty(facultyId: ID!): Faculty
          listFaculty(limit: Int, nextToken: String): FacultyList
        }
        type Mutation {
          _empty: String
          createForm(input: CreateFormInput!): FormDefinition
          publishForm(form_id: ID!): FormDefinition
          submitForm(input: SubmitFormInput!): FormSubmission
          createNotificationTemplate(input: CreateTemplateInput!): NotificationTemplate
          updateNotificationPreference(input: UpdatePreferenceInput!): NotificationPreference
          getUploadUrl(module: String, entity_id: String, extension: String): UploadUrlResult
          getDownloadUrl(key: String!): DownloadUrlResult
          deleteFile(file_id: ID!): MutationResponse
          createTenant(input: CreateTenantInput!): Tenant
          updateTenant(tenant_id: ID!, input: UpdateTenantInput!): Tenant
          suspendTenant(tenant_id: ID!): Tenant
          updateUser(user_id: ID!, input: UpdateUserInput!): User
          inviteUser(input: InviteUserInput!): User
          deactivateUser(user_id: ID!): User
          createRole(input: CreateRoleInput!): Role
          updateRole(role_id: ID!, input: UpdateRoleInput!): Role
          assignRole(user_id: ID!, role_id: ID!): User
          removeRole(user_id: ID!, role_id: ID!): User
          createDepartment(input: CreateDepartmentInput!): Department
          updateDepartment(input: UpdateDepartmentInput!): Department
          deleteDepartment(departmentId: ID!): Department
          createDeptCourse(input: CreateDeptCourseInput!): DeptCourse
          updateDeptCourse(input: UpdateDeptCourseInput!): DeptCourse
          deleteDeptCourse(deptCourseId: ID!): DeptCourse
        
          createDeptTimetable(input: CreateDeptTimetableInput!): DeptTimetable
          updateDeptTimetable(input: UpdateDeptTimetableInput!): DeptTimetable
          deleteDeptTimetable(deptTimetableId: ID!): DeptTimetable
        
          createLearningMaterial(input: CreateLearningMaterialInput!): LearningMaterial
          updateLearningMaterial(input: UpdateLearningMaterialInput!): LearningMaterial
          deleteLearningMaterial(learningMaterialId: ID!): LearningMaterial
        
          createInnovativeTeaching(input: CreateInnovativeTeachingInput!): InnovativeTeaching
          updateInnovativeTeaching(input: UpdateInnovativeTeachingInput!): InnovativeTeaching
          deleteInnovativeTeaching(innovativeTeachingId: ID!): InnovativeTeaching
        
          createResultAnalysis(input: CreateResultAnalysisInput!): ResultAnalysis
          updateResultAnalysis(input: UpdateResultAnalysisInput!): ResultAnalysis
          deleteResultAnalysis(resultAnalysisId: ID!): ResultAnalysis
          createPlacementOverview(input: CreatePlacementOverviewInput!): PlacementOverview
          updatePlacementOverview(input: UpdatePlacementOverviewInput!): PlacementOverview
          deletePlacementOverview(placementOverviewId: ID!): PlacementOverview
        
          createStudentPlacement(input: CreateStudentPlacementInput!): StudentPlacement
          updateStudentPlacement(input: UpdateStudentPlacementInput!): StudentPlacement
          deleteStudentPlacement(studentPlacementId: ID!): StudentPlacement
        
          createAchievement(input: CreateAchievementInput!): Achievement
          updateAchievement(input: UpdateAchievementInput!): Achievement
          deleteAchievement(achievementId: ID!): Achievement
        
          createDeptActivity(input: CreateDeptActivityInput!): DeptActivity
          updateDeptActivity(input: UpdateDeptActivityInput!): DeptActivity
          deleteDeptActivity(deptActivityId: ID!): DeptActivity
        
          saveForumSection(input: SaveForumSectionInput!): ForumSection
        
          createForumEvent(input: CreateForumEventInput!): ForumEvent
          updateForumEvent(input: UpdateForumEventInput!): ForumEvent
          deleteForumEvent(forumEventId: ID!): ForumEvent
        
          createDepartmentActivity(input: CreateDepartmentActivityInput!): DepartmentActivityLog
          updateDepartmentActivity(input: UpdateDepartmentActivityInput!): DepartmentActivityLog
          deleteDepartmentActivity(deptActivityLogId: ID!): DepartmentActivityLog
        
          createNewsletter(input: CreateNewsletterInput!): Newsletter
          updateNewsletter(input: UpdateNewsletterInput!): Newsletter
          deleteNewsletter(newsletterId: ID!): Newsletter
        
          createGalleryPhoto(input: CreateGalleryPhotoInput!): GalleryPhoto
          updateGalleryPhoto(input: UpdateGalleryPhotoInput!): GalleryPhoto
          deleteGalleryPhoto(galleryPhotoId: ID!): GalleryPhoto
          saveDeptBranding(deptId: ID!, input: SaveDeptBrandingInput!): DeptBranding
          saveInstituteSettings(input: SaveInstituteSettingsInput!): InstituteSettings
          saveDeptIntroduction(deptId: ID!, input: SaveDeptIntroductionInput!): DeptIntroduction
          saveDeptAbout(deptId: ID!, input: SaveDeptAboutInput!): DeptAbout
          saveDeptSwot(deptId: ID!, input: SaveDeptSwotInput!): DeptSwot
          saveHodProfile(deptId: ID!, input: SaveHodProfileInput!): HodProfile
        
          createProgramOutcome(input: CreateProgramOutcomeInput!): ProgramOutcome
          updateProgramOutcome(input: UpdateProgramOutcomeInput!): ProgramOutcome
          deleteProgramOutcome(programOutcomeId: ID!): ProgramOutcome
          reorderProgramOutcomes(input: ReorderProgramOutcomesInput!): Boolean
        
          createCommitteeMember(input: CreateCommitteeMemberInput!): CommitteeMember
          updateCommitteeMember(input: UpdateCommitteeMemberInput!): CommitteeMember
          deleteCommitteeMember(committeeMemberId: ID!): CommitteeMember
        
          createDistinguishedAlumnus(input: CreateDistinguishedAlumnusInput!): DistinguishedAlumnus
          updateDistinguishedAlumnus(input: UpdateDistinguishedAlumnusInput!): DistinguishedAlumnus
          deleteDistinguishedAlumnus(distinguishedAlumnusId: ID!): DistinguishedAlumnus
          createDeptStaff(input: CreateDeptStaffInput!): DeptStaff
          updateDeptStaff(input: UpdateDeptStaffInput!): DeptStaff
          deleteDeptStaff(deptStaffId: ID!): DeptStaff
        
          createAccreditation(input: CreateAccreditationInput!): Accreditation
          updateAccreditation(input: UpdateAccreditationInput!): Accreditation
          deleteAccreditation(accreditationId: ID!): Accreditation
          createDeptPublication(input: CreateDeptPublicationInput!): DeptPublication
          updateDeptPublication(input: UpdateDeptPublicationInput!): DeptPublication
          deleteDeptPublication(deptPublicationId: ID!): DeptPublication
        
          savePublicationProfile(input: SavePublicationProfileInput!): PublicationProfile
        
          createResearchGrant(input: CreateResearchGrantInput!): ResearchGrant
          updateResearchGrant(input: UpdateResearchGrantInput!): ResearchGrant
          deleteResearchGrant(researchGrantId: ID!): ResearchGrant
        
          createPatent(input: CreatePatentInput!): Patent
          updatePatent(input: UpdatePatentInput!): Patent
          deletePatent(patentId: ID!): Patent
        
          createFacultyResearchSummary(input: CreateFacultyResearchSummaryInput!): FacultyResearchSummary
          updateFacultyResearchSummary(input: UpdateFacultyResearchSummaryInput!): FacultyResearchSummary
          deleteFacultyResearchSummary(facultyResearchSummaryId: ID!): FacultyResearchSummary
        
          createPhdGuide(input: CreatePhdGuideInput!): PhdGuide
          updatePhdGuide(input: UpdatePhdGuideInput!): PhdGuide
          deletePhdGuide(phdGuideId: ID!): PhdGuide
        
          createPhdScholar(input: CreatePhdScholarInput!): PhdScholar
          updatePhdScholar(input: UpdatePhdScholarInput!): PhdScholar
          deletePhdScholar(phdScholarId: ID!): PhdScholar
          createFaculty(input: CreateFacultyInput!): Faculty
          updateFaculty(input: UpdateFacultyInput!): Faculty
          deleteFaculty(facultyId: ID!): Faculty
        
          addPublication(input: AddPublicationInput!): Publication
          updatePublication(input: UpdatePublicationInput!): Publication
          removePublication(input: RemovePublicationInput!): Publication
        
          addEducation(input: AddEducationInput!): Education
          updateEducation(input: UpdateEducationInput!): Education
          removeEducation(input: RemoveEducationInput!): Education
        
          addWorkExperience(input: AddWorkExperienceInput!): WorkExperience
          updateWorkExperience(input: UpdateWorkExperienceInput!): WorkExperience
          removeWorkExperience(input: RemoveWorkExperienceInput!): WorkExperience
        
          addResearchProject(input: AddResearchProjectInput!): ResearchProject
          updateResearchProject(input: UpdateResearchProjectInput!): ResearchProject
          removeResearchProject(input: RemoveResearchProjectInput!): ResearchProject
        
          addCourseTeaching(input: AddCourseTeachingInput!): CourseTeaching
          updateCourseTeaching(input: UpdateCourseTeachingInput!): CourseTeaching
          removeCourseTeaching(input: RemoveCourseTeachingInput!): CourseTeaching
        
          addHonor(input: AddHonorInput!): Honor
          updateHonor(input: UpdateHonorInput!): Honor
          removeHonor(input: RemoveHonorInput!): Honor
        }
        
        # module: audit-log
        type AuditEntry {
          entry_id: ID!
          tenant_id: ID!
          actor_id: String
          actor_email: String
          action: String!
          resource_type: String
          resource_id: String
          before: AWSJSON
          after: AWSJSON
          metadata: AuditMetadata
          timestamp: AWSDateTime
        }
        
        type AuditMetadata {
          ip: String
          user_agent: String
          source: String
          detail_type: String
        }
        
        type AuditEntryConnection {
          items: [AuditEntry!]!
          nextCursor: String
        }
        
        input AuditEntryFilter {
          action: String
          resource_type: String
          actor_id: String
          from: AWSDateTime
          to: AWSDateTime
        }
        
        
        # module: form-management
        type FormDefinition {
          form_id: ID!
          tenant_id: ID!
          title: String!
          description: String
          version: Int
          status: String
          fields: [AWSJSON]
          settings: AWSJSON
          created_at: AWSDateTime
        }
        
        type FormSubmission {
          submission_id: ID!
          form_id: ID!
          tenant_id: ID!
          submitted_by: String
          responses: [AWSJSON]
          status: String
          submitted_at: AWSDateTime
        }
        
        type FormDefinitionConnection {
          items: [FormDefinition!]!
          nextCursor: String
        }
        
        type FormSubmissionConnection {
          items: [FormSubmission!]!
          nextCursor: String
        }
        
        input CreateFormInput {
          title: String!
          description: String
          fields: [AWSJSON]
          settings: AWSJSON
        }
        
        input SubmitFormInput {
          form_id: ID!
          responses: [AWSJSON]
        }
        
        
        
        # module: notification-management
        enum NotificationChannel {
          email
          sms
          push
          in_app
        }
        
        type NotificationTemplate {
          template_id: ID!
          tenant_id: ID!
          name: String!
          channel: NotificationChannel!
          subject: String
          body_html: String
          variables: [String]
          created_at: AWSDateTime
        }
        
        type Notification {
          notification_id: ID!
          tenant_id: ID!
          recipient_email: String
          channel: String
          status: String
          sent_at: AWSDateTime
        }
        
        type NotificationPreference {
          user_id: ID!
          tenant_id: ID!
          channels: ChannelPreference
          quiet_hours: QuietHours
        }
        
        type ChannelPreference {
          email: Boolean
          push: Boolean
          in_app: Boolean
        }
        
        type QuietHours {
          start: String
          end: String
        }
        
        input CreateTemplateInput {
          name: String!
          channel: NotificationChannel
          subject: String
          body_html: String
          body_text: String
          variables: [String]
        }
        
        input UpdatePreferenceInput {
          user_id: String
          channels: ChannelPreferenceInput
          quiet_hours: QuietHoursInput
        }
        
        input ChannelPreferenceInput {
          email: Boolean
          push: Boolean
          in_app: Boolean
        }
        
        input QuietHoursInput {
          start: String
          end: String
        }
        
        
        
        type NotificationTemplateConnection {
          items: [NotificationTemplate!]!
          nextCursor: String
        }
        
        type NotificationConnection {
          items: [Notification!]!
          nextCursor: String
        }
        
        # module: storage-management
        type FileMetadata {
          file_id: ID!
          tenant_id: ID!
          key: String!
          original_name: String
          mime_type: String
          size_bytes: Int
          uploaded_by: String
          module: String
          entity_id: String
          created_at: AWSDateTime
        }
        
        type FileConnection {
          items: [FileMetadata!]!
          nextCursor: String
        }
        
        type UploadUrlResult {
          upload_url: String!
          key: String!
          file_id: ID!
        }
        
        type DownloadUrlResult {
          download_url: String!
        }
        
        
        
        # module: tenant-management
        enum TenantPlan {
          free
          starter
          pro
          enterprise
        }
        
        enum TenantStatus {
          active
          suspended
          archived
        }
        
        type TenantConfig {
          features_enabled: [String]
          max_users: Int
          branding: TenantBranding
        }
        
        type TenantBranding {
          logo_url: String
          primary_color: String
        }
        
        type Tenant {
          tenant_id: ID!
          name: String!
          slug: String!
          plan: TenantPlan!
          status: TenantStatus!
          config: TenantConfig
          owner_user_id: String
          created_by: String
          created_at: AWSDateTime
          updated_at: AWSDateTime
        }
        
        type TenantConnection {
          items: [Tenant!]!
          nextCursor: String
        }
        
        input CreateTenantInput {
          name: String!
          slug: String
          plan: TenantPlan
          owner_user_id: String
          config: TenantConfigInput
        }
        
        input TenantConfigInput {
          features_enabled: [String]
          max_users: Int
          branding: TenantBrandingInput
        }
        
        input TenantBrandingInput {
          logo_url: String
          primary_color: String
        }
        
        input UpdateTenantInput {
          name: String
          slug: String
          plan: TenantPlan
          config: TenantConfigInput
        }
        
        
        
        # module: user-management
        enum UserStatus {
          active
          invited
          suspended
          deactivated
        }
        
        type User {
          user_id: ID!
          tenant_id: ID!
          email: String!
          name: String
          status: UserStatus!
          roles: [String!]
          profile: AWSJSON
          created_at: AWSDateTime
          updated_at: AWSDateTime
        }
        
        type UserConnection {
          items: [User!]!
          nextCursor: String
        }
        
        type Role {
          role_id: ID!
          tenant_id: ID!
          name: String!
          description: String
          permissions: [String!]
          is_system: Boolean
          created_at: AWSDateTime
          updated_at: AWSDateTime
        }
        
        type RoleConnection {
          items: [Role!]!
          nextCursor: String
        }
        
        input UpdateUserInput {
          name: String
          profile: AWSJSON
          status: UserStatus
        }
        
        input InviteUserInput {
          email: String!
          name: String
        }
        
        input CreateRoleInput {
          name: String!
          description: String
          permissions: [String!]
        }
        
        input UpdateRoleInput {
          name: String
          description: String
          permissions: [String!]
        }
        
        
        
        # module: workflow-management
        type WorkflowDefinition {
          workflow_id: ID!
          tenant_id: ID!
          name: String!
          trigger: AWSJSON
          steps: [AWSJSON]
          status: String
          created_at: AWSDateTime
        }
        
        type WorkflowInstance {
          instance_id: ID!
          workflow_id: ID!
          tenant_id: ID!
          state: String
          current_step_id: String
          context: AWSJSON
          created_at: AWSDateTime
        }
        
        type WorkflowDefinitionConnection {
          items: [WorkflowDefinition!]!
          nextCursor: String
        }
        
        type WorkflowInstanceConnection {
          items: [WorkflowInstance!]!
          nextCursor: String
        }
        
        
        # module: department-management
        type Department {
          departmentId:  ID!
          tenantId:      ID!
          name:          String!
          shortName:     String!
          hod:           String
          established:   Int
          totalFaculty:  Int
          totalStudents: Int
          status:        String
          description:   String
          imageUrl:      String
          createdAt:     AWSDateTime
          updatedAt:     AWSDateTime
        }
        
        type DepartmentList {
          items:     [Department]
          nextToken: String
        }
        
        input CreateDepartmentInput {
          name:        String!
          shortName:   String!
          hod:         String
          established: Int
          description: String
          imageUrl:    String
          status:      String
        }
        
        input UpdateDepartmentInput {
          departmentId:  ID!
